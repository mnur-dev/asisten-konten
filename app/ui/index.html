<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Konten — Catur</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2b2f38; --ink: #e6e8ec;
    --muted: #8b93a1; --accent: #7bb26a; --warn: #d9a441; --bad: #d96a5f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 230px 1fr; height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  section { overflow-y: auto; padding: 18px 22px; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           padding: 7px 13px; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: #48505f; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10210c;
                   font-weight: 600; }
  input, textarea { width: 100%; background: #0f1114; color: var(--ink);
                    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
                    font: inherit; }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; min-height: 130px; resize: vertical; }
  label { display: block; margin: 12px 0 5px; color: var(--muted); font-size: 12px; }
  .proj { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 3px; }
  .proj:hover { background: var(--panel); }
  .proj.on { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
  .proj b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .proj i { font-style: normal; color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
          padding: 15px; margin-bottom: 15px; }
  pre { background: #0f1114; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        font-size: 11.5px; max-height: 190px; overflow: auto; margin: 0; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       padding: 5px 8px; position: sticky; top: 0; background: var(--panel); }
  td { padding: 4px 8px; border-top: 1px solid var(--line); }
  tr.ply { cursor: pointer; }
  tr.ply:hover td { background: #232830; }
  tr.ply.on td { background: #2c3340; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
  .ok { color: var(--accent); border-color: #34502c; }
  .guess { color: var(--warn); border-color: #5b4820; }
  .edited { color: #6fa8d4; border-color: #274157; }
  /* Move grades, in the same colours core/render.py paints on the board. Kept as
     text on a tinted chip rather than a filled circle: at 11px a circle turns into
     an unreadable dot, and the table already has enough colour in it. */
  .grade { font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
           border: 1px solid currentColor; opacity: .95; }
  .grade-brilliant { color: #26c2a3; }
  .grade-great { color: #7aaad4; }
  .grade-best { color: #96bc4b; }
  .grade-excellent, .grade-good { color: var(--muted); border-color: var(--line); }
  .grade-inaccuracy { color: #f7c631; }
  .grade-mistake { color: #ffa459; }
  .grade-blunder { color: #fa412d; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .split img { width: 100%; border-radius: 7px; display: block; background: #0f1114; }
  /* The short preview stacks transparent layers (caption PNG, board art) over the
     video, so they must NOT pick up .split img's opaque fill -- that turns the top
     layer into a solid rectangle hiding everything underneath it. */
  #shortPreviewWrap img, #shortPreviewWrap video { background: transparent; border-radius: 0; }
  .split figcaption { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
  .scroll { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
  .err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; }
  /* Phones: the two fixed-height scroll panes become one normal page, the
     project list sits on top (capped so it doesn't push the panel off-screen),
     and every side-by-side .split stacks. */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    header { padding: 10px 14px; flex-wrap: wrap; gap: 4px 10px; }
    main { display: block; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh;
            padding: 10px 14px; }
    section { overflow: visible; padding: 12px 14px; }
    .card { padding: 12px; }
    .split { grid-template-columns: 1fr; }
    .scroll { max-height: 300px; overflow-x: auto; }
    button { min-height: 36px; }
    input, textarea { font-size: 16px; }  /* < 16px makes iOS zoom in on focus */
    input[type=number] { width: 64px !important; }
    .look-img { width: 100% !important; max-width: 280px; }
    .look-opts { flex-basis: 100% !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Asisten Konten — Catur</h1>
  <span id="sub">lokal · 127.0.0.1</span>
</header>
<main>
  <aside>
    <button style="width:100%" onclick="showNew()">+ Proyek baru</button>
    <div id="list" style="margin-top:12px"></div>
  </aside>
  <section id="panel"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null, state = null, selected = null, timer = null, dirty = false;
let picking = false, pick = null, pickAt = null;
let quadPoints = [], quadDragIndex = null;
let videoEl = null, rafId = null, rate = 0.5, lookStamp = 0;
let musicList = [];
// The preview <video> lives in the card's own markup, so every redraw hands us a
// brand new element -- these carry playback across that so editing a box mid-play
// doesn't restart the clip. (An earlier version kept one detached element and
// re-parented it on each redraw; Chrome stalls a media element moved that way,
// which left the preview showing everything except the video.)
let spAudioEl = null, spRafId = null, spWindowsKey = null, spLoopActive = false;
let spTime = null, spPlaying = false;
// Windows/index live out here so the scrub bar can move the playhead between
// jump-cut windows without reaching into the loop's closure.
let spWindows = [], spIdx = 0, spScrubbing = false, spFramePlies = null, spOptsTimer = null;
let spTextKey = null, spPopEl = null, spLastElapsed = -1;
// The short's cut, as edited on screen. It lives here rather than in the inputs
// themselves because draw() rebuilds the whole panel (every save, every poll tick),
// and values read straight off the DOM snapped back to their defaults, quietly
// putting the preview back to 20 plies. The saved copy lives on the project --
// this is the draft, seeded from it whenever a project is opened.
let shortOpts = { plies: 20, pad: 1, tail: 0 }, shortOptsFor = null;
// Seconds of broadcast kept before the first move in the long video. 0 = open on
// move 1. Held here while typing; pushed to the project right before a render.
let leadIn = 0;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
  return response.status === 204 ? null : response.json();
}

async function loadList() {
  const { projects } = await api("api/projects");
  $("list").innerHTML = projects.map((p) => `
    <div class="proj ${p.id === current ? "on" : ""}" onclick="open_('${p.id}')">
      <b>${escape_(p.name || p.id)}</b><i>${p.status}</i>
      <button title="Hapus proyek" onclick="event.stopPropagation();deleteProject('${p.id}','${escape_(p.name || p.id).replace(/'/g, "\\'")}')"
        style="float:right;padding:1px 7px;font-size:12px">×</button></div>`).join("")
    || `<p class="hint">Belum ada proyek.</p>`;
  // Wiping everything is permanent, so the button only exists when there is
  // something to wipe -- and it asks twice.
  if (projects.length) $("list").insertAdjacentHTML("beforeend",
    `<button onclick="deleteAllProjects(${projects.length})"
       style="width:100%;margin-top:10px;font-size:12px;color:var(--bad)">× Hapus semua proyek</button>`);
}

async function deleteAllProjects(count) {
  if (!confirm(`Hapus SEMUA ${count} proyek? Semua video dan datanya akan hilang permanen.`)) return;
  if (!confirm("Yakin? Tindakan ini tidak bisa dibatalkan.")) return;
  try {
    const { deleted, busy } = await api("api/projects", { method: "DELETE" });
    current = null; selected = null; clearInterval(timer); clearInterval(rafId);
    $("panel").innerHTML = "";
    await loadList();
    if (busy.length) alert(`${deleted} proyek dihapus. Masih sibuk, dilewati: ${busy.join(", ")}`);
  } catch (e) { alert(e.message); }
}

async function deleteProject(id, name) {
  if (!confirm(`Hapus proyek "${name}"? Semua video dan datanya akan hilang permanen.`)) return;
  try {
    await api(`api/projects/${id}`, { method: "DELETE" });
    if (id === current) {
      current = null; selected = null; clearInterval(timer); clearInterval(rafId);
      $("panel").innerHTML = "";
    }
    await loadList();
  } catch (e) { alert(e.message); }
}

function escape_(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(t) { return t === null || t === undefined ? "—" : Number(t).toFixed(2) + "s"; }

function showNew() {
  current = null; selected = null; clearInterval(timer); loadList();
  $("panel").innerHTML = `
    <div class="card" style="max-width:720px">
      <h2 style="margin:0 0 4px;font-size:15px">Proyek baru</h2>
      <p class="hint">Tempel link video (YouTube, dll) dan PGN pertandingannya. Videonya diunduh otomatis.</p>
      <label>Link video</label>
      <input id="vp" placeholder="https://www.youtube.com/watch?v=...">
      <label>Nama (opsional)</label>
      <input id="nm" placeholder="Carlsen vs Gao">
      <label>PGN</label>
      <textarea id="pg" placeholder="[Event ...]&#10;1. e4 c5 ..."></textarea>
      <div class="row" style="margin-top:14px">
        <button class="primary" onclick="create()">Buat proyek</button>
        <span id="msg" class="err"></span>
      </div>
    </div>`;
}

async function create() {
  $("msg").textContent = "";
  try {
    const { id } = await api("api/projects", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_url: $("vp").value, name: $("nm").value, pgn_text: $("pg").value }),
    });
    await loadList(); open_(id);
  } catch (e) { $("msg").textContent = e.message; }
}

async function open_(id) {
  if (dirty && !confirm("Ada perubahan waktu yang belum disimpan. Tinggalkan?")) return;
  current = id; selected = null; dirty = false; picking = false; pick = null;
  segStart = null; clearInterval(rafId);
  clearInterval(spRafId); spWindowsKey = null; spLoopActive = false;
  spTime = null; spPlaying = false; spWindows = []; spFramePlies = null; spScrubbing = false;
  spTextKey = null; shortOptsFor = null;
  clearInterval(timer); await refresh(); loadList();
  timer = setInterval(() => { if (state?.busy) refresh(); }, 1500);
}

async function refresh() {
  if (!current) return;
  state = await api(`api/projects/${current}`);
  draw();
}

function draw() {
  const s = state, busy = s.busy;
  const done = (s.waypoints || []).filter((w) => w.timestamp !== null);
  const observed = done.filter((w) => w.observed).length;
  const hasBoard = (s.outputs || []).includes("board.mp4");
  if (shortOptsFor !== current) {          // opening a project: start from what it stored
    shortOptsFor = current;
    shortOpts = { plies: s.short_plies ?? 20, pad: s.short_pad ?? 1, tail: s.short_tail ?? 0 };
    leadIn = s.lead_in ?? 0;
    thumbAt = s.thumb_time ?? 0;
    thumbPrompt = s.thumb_prompt || ""; thumbPromptDirty = false;
  }
  const cutDirty = shortOptsDirty(s);
  $("panel").innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0;font-size:15px">${escape_(s.name)}</h2>
          <p class="hint" style="margin:3px 0 0">
            ${escape_(s.white)} — ${escape_(s.black)} · ${s.plies_total} ply ·
            <span style="opacity:.7">${escape_(s.video)}</span></p>
        </div>
        <div class="row">
          ${s.status === "failed" && !s.width ? `<button class="primary" ${busy ? "disabled" : ""}
                  onclick="run('retry-download')">Coba unduh lagi</button>` : ""}
          <button ${busy ? "disabled" : ""} onclick="run('detect')">
            ${s.waypoints ? "Deteksi ulang" : "Deteksi"}</button>
          <button ${busy ? "disabled" : ""} onclick="togglePicker()">
            ${s.board_quad ? "Ubah papan fisik" : "Pilih papan fisik"}</button>
          <button ${busy ? "disabled" : ""} onclick="toggleLayout()"
                  title="Posisi papan render, hapus logo, blur, logo sendiri, nama pemain">
            Tata letak</button>
          <button ${busy || !s.waypoints || !s.board_quad ? "disabled" : ""}
                  onclick="run('retime')" title="Geser waktu tiap ply mengikuti papan kayu">
            Ikuti papan fisik</button>
          <button class="primary" ${busy || !s.waypoints ? "disabled" : ""} onclick="runRender()"
                  title="Render video panjang saja (board.mp4 + full-video.mp4). Short punya tombol sendiri.">
            Render video panjang</button>
          <span class="hint">mulai −</span>
          <input id="leadIn" type="number" min="0" step="5" value="${leadIn}"
                 title="Detik siaran yang disisakan sebelum langkah pertama. 0 = video langsung mulai di langkah 1; 60 = mulai satu menit sebelumnya."
                 style="width:56px;padding:7px 6px" oninput="setLeadIn(this.value)">
          <span class="hint" style="margin-right:6px">dtk</span>
          <span class="hint">ply</span>
          <input id="shortPlies" type="number" min="1" value="${shortOpts.plies}"
                 title="Jumlah ply terakhir yang dipakai"
                 style="width:56px;padding:7px 6px" oninput="setShortOpt('plies', this.value)">
          <span class="hint">jeda</span>
          <input id="shortPad" type="number" min="0.1" step="0.1" value="${shortOpts.pad}"
                 title="Detik disisakan sebelum & sesudah tiap ply -- makin kecil, makin pendek shortnya"
                 style="width:56px;padding:7px 6px" oninput="setShortOpt('pad', this.value)">
          <span class="hint">ekor</span>
          <input id="shortTail" type="number" min="0" step="0.5" value="${shortOpts.tail}"
                 title="Detik tambahan setelah ply terakhir -- posisi akhir ditahan selama ini"
                 style="width:56px;padding:7px 6px" oninput="setShortOpt('tail', this.value)">
          <span id="shortEstimate" class="hint" style="min-width:78px"></span>
          <button id="shortSave" ${busy || !cutDirty ? "disabled" : ""}
                  ${cutDirty ? 'class="primary"' : ""} onclick="saveShortOpts()"
                  title="Simpan ply/jeda/ekor ke proyek ini -- dipakai semua panel yang menghitung durasi, dan bertahan setelah halaman dimuat ulang">
            ${cutDirty ? "Simpan durasi" : "Tersimpan"}</button>
          <button class="primary" ${busy || !s.waypoints ? "disabled" : ""} onclick="runShort()"
                  title="${hasBoard
                    ? "Render short.mp4 saja, pakai board.mp4 dari render sebelumnya (video panjang tidak disentuh)"
                    : "Render short.mp4 saja -- board.mp4 dibuat dulu karena belum ada, jadi kali ini lebih lama"}">
            Render short</button>
          <button ${busy || !s.waypoints ? "disabled" : ""} onclick="toggleShort()"
                  title="Atur posisi papan & teks, dengan pratinjau live di sebelahnya">
            Layout & preview short${s.has_short_layout ? " ✓" : ""}</button>
          <button ${busy ? "disabled" : ""} onclick="toggleThumb()"
                  title="Buat thumbnail YouTube dari satu frame video: gambar dibersihkan AI, judul digambar sendiri">
            Thumbnail${s.has_thumbnail ? " ✓" : ""}</button>
          <button ${busy ? "disabled" : ""} title="Hapus proyek ini"
                  onclick="deleteProject('${current}','${escape_(s.name).replace(/'/g, "\\'")}')">Hapus</button>
        </div>
      </div>
      <p style="margin:11px 0 0">
        Status: <b>${s.status}</b>${busy ? " · sedang berjalan…" : ""}
        ${s.waypoints ? ` · ${done.length}/${s.plies_total} ply berwaktu ·
           <span class="tag ok">${observed} terbaca langsung</span>` : ""}
        ${s.error ? `<br><span class="err">${escape_(s.error)}</span>` : ""}
      </p>
      ${s.download_progress ? `<div style="margin-top:8px">
        <div style="height:6px;border-radius:3px;background:#0004;overflow:hidden">
          <div style="height:100%;width:${s.download_progress.percent}%;background:var(--accent)"></div>
        </div>
        <p class="hint" style="margin:4px 0 0">Mengunduh video: ${s.download_progress.percent}%${
          s.download_progress.eta && s.download_progress.eta !== "Unknown"
            ? ` · sisa ${s.download_progress.eta}` : ""}</p>
      </div>` : ""}
      ${(s.outputs || []).length ? `<div class="row" style="margin-top:11px">` +
        s.outputs.map((f) => `<a href="api/projects/${current}/file/${f}" target="_blank"
          style="color:var(--accent)">${f}</a>`).join(" · ") + `</div>` : ""}
    </div>
    ${s.themes ? lookCard(s) : ""}
    ${picking === "short" ? shortEditorCard(s)
      : picking === "thumb" ? thumbEditorCard(s) : picking ? pickerCard(s) : ""}
    ${s.log ? `<div class="card"><div class="hint" style="margin-bottom:7px">Log</div>
       <pre id="log">${escape_(s.log)}</pre></div>` : ""}
    ${s.waypoints ? waypointsCard(s) : ""}`;
  if (s.waypoints) updateShortEstimate();
  if (picking === "short") { wireShortPicker(); wireShortPreview(); }
  else if (picking === "thumb") { wireThumbPicker(); refreshThumbPromptButton(); }
  else if (picking) wirePicker();
  const log = $("log"); if (log) log.scrollTop = log.scrollHeight;
  if (segStart !== null && s.waypoints) showSegment(segStart);
}

// core/classify.py's grades. "excellent" and "good" get no symbol on purpose --
// between them they cover most of a strong game, and a chip on nearly every row
// would bury the handful that matter.
const GRADES = { brilliant: "!!", great: "!", best: "★",
                 inaccuracy: "?!", mistake: "?", blunder: "??" };

function gradeChip(w) {
  if (!GRADES[w.label]) return "";
  const loss = w.loss === null || w.loss === undefined ? "" : ` · -${w.loss}% peluang menang`;
  return ` <span class="grade grade-${w.label}" title="${w.label}${loss}">${GRADES[w.label]}</span>`;
}

function gradeCounts(counts) {
  const parts = Object.keys(GRADES).filter((name) => counts[name]).map((name) =>
    `<span class="grade grade-${name}" title="${name}">${GRADES[name]} ${counts[name]}</span>`);
  return parts.length ? parts.join(" ") : `<span class="hint">tidak ada</span>`;
}

function waypointsCard(s) {
  const rows = s.waypoints.map((w) => {
    const tag = w.edited ? `<span class="tag edited">manual</span>`
      : w.source === "physical" ? `<span class="tag ok">papan ${w.shift >= 0 ? "+" : ""}${w.shift}s</span>`
      : w.observed ? `<span class="tag ok">overlay</span>`
      : `<span class="tag guess">tebakan</span>`;
    const flag = w.needs_review ? ` <span class="tag guess">cek</span>` : "";
    const move = `${w.move_number}${w.side === "white" ? "." : "..."} ${escape_(w.san)}`;
    return `<tr class="ply ${selected === w.ply ? "on" : ""}" onclick="showReview(${w.ply})">
      <td style="color:var(--muted)">${w.ply}</td><td>${move}${gradeChip(w)}</td>
      <td>${fmt(w.timestamp)}</td><td>${tag}${flag}</td></tr>`;
  }).join("");
  return `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:9px">
        <b style="font-size:13px">Timeline</b>
        <button ${dirty ? "" : "disabled"} onclick="save()">Simpan perubahan</button>
      </div>
      <div class="split">
        <div class="scroll"><table>
          <thead><tr><th>#</th><th>langkah</th><th>waktu</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div id="review"><p class="hint">Klik satu langkah untuk memutar rentang
          ${segLen} detik di sekitarnya.</p></div>
      </div>
    </div>`;
}

function lookCard(s) {
  const ply = Math.min(24, s.plies_total);
  const swatch = (name) => `<button onclick="setLook('theme','${name}')"
      style="padding:4px 10px;font-size:12px;${name === s.theme
        ? "border-color:var(--accent);color:var(--accent)" : ""}">${name}</button>`;
  const setBtn = (name) => `<button onclick="setLook('piece_set','${name}')"
      style="padding:4px 10px;font-size:12px;${name === s.piece_set
        ? "border-color:var(--accent);color:var(--accent)" : ""}">${escape_(name)}</button>`;
  return `<div class="card">
    <div class="row" style="align-items:flex-start;gap:18px">
      <img src="api/projects/${current}/board?ply=${ply}&width=210&_=${lookStamp}"
           class="look-img" style="width:210px;border-radius:8px;flex:none">
      <div class="look-opts" style="flex:1">
        <div class="hint" style="margin-bottom:6px">Warna papan</div>
        <div class="row" style="margin-bottom:12px">${s.themes.map(swatch).join("")}</div>
        <div class="hint" style="margin-bottom:6px">Set bidak</div>
        <div class="row" style="margin-bottom:12px">${s.piece_sets.map(setBtn).join("")}</div>
        <div class="hint" style="margin-bottom:6px">Tambahan</div>
        <div class="row">
          <button onclick="setLook('sound',${!s.sound})" style="padding:4px 10px;font-size:12px;
            ${s.sound ? "border-color:var(--accent);color:var(--accent)" : ""}">
            ${s.sound ? "🔊 suara langkah" : "🔇 tanpa suara"}</button>
          <button onclick="setLook('eval_bar',${!s.eval_bar})" ${s.has_evaluations ? "" : "disabled"}
            style="padding:4px 10px;font-size:12px;
            ${s.eval_bar ? "border-color:var(--accent);color:var(--accent)" : ""}">eval bar</button>
          <button onclick="setLook('clock_box',${!s.clock_box})" ${s.has_clocks ? "" : "disabled"}
            title="${s.has_clocks ? "Jam dari [%clk] di PGN" : "PGN ini tidak punya [%clk]"}"
            style="padding:4px 10px;font-size:12px;
            ${s.clock_box ? "border-color:var(--accent);color:var(--accent)" : ""}">⏱ jam</button>
          <button onclick="setLook('flip_board',${!s.flip_board})"
            title="Balik papan: hitam di bawah. Eval bar dan papan jam ikut terbalik."
            style="padding:4px 10px;font-size:12px;
            ${s.flip_board ? "border-color:var(--accent);color:var(--accent)" : ""}">
            ${s.flip_board ? "⇅ hitam di bawah" : "⇅ balik papan"}</button>
          <button onclick="setLook('move_badge',${!s.move_badge})"
            ${s.has_classification ? "" : "disabled"}
            title="${s.has_classification ? "Badge !! / ?? di petak tujuan langkah"
              : "Hitung evaluasi dulu untuk mendapat klasifikasi"}"
            style="padding:4px 10px;font-size:12px;
            ${s.move_badge ? "border-color:var(--accent);color:var(--accent)" : ""}">!! badge</button>
          <button onclick="startEvaluate()" ${s.busy ? "disabled" : ""}
            style="padding:4px 10px;font-size:12px">Hitung evaluasi</button>
          <span class="hint">${s.has_classification ? "evaluasi + klasifikasi tersimpan"
            : s.has_evaluations ? "evaluasi tersimpan — klik untuk klasifikasi langkah"
            : s.engine ? "engine: " + escape_(s.engine.split(/[\\/]/).pop()) : "belum ada engine"}</span>
        </div>
        ${s.classification ? `
        <div class="hint" style="margin:12px 0 6px">Klasifikasi langkah</div>
        <div class="row" style="gap:8px">
          <span class="hint" style="width:42px">Putih</span>${gradeCounts(s.classification.white)}
        </div>
        <div class="row" style="gap:8px;margin-top:5px">
          <span class="hint" style="width:42px">Hitam</span>${gradeCounts(s.classification.black)}
        </div>` : ""}
        <p class="hint" style="margin:12px 0 0">Set bidak tambahan: taruh SVG di
          <code>assets/pieces/&lt;nama&gt;/wK.svg</code> … <code>bP.svg</code>.
          Engine: taruh Stockfish di <code>engines/</code>.</p>
      </div>
    </div>
  </div>`;
}

async function setLook(field, value) {
  await api(`api/projects/${current}/look`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [field]: value }),
  });
  lookStamp = Date.now();
  refresh();
}

async function startEvaluate() {
  try {
    const result = await api(`api/projects/${current}/evaluate`, { method: "POST" });
    lookStamp = Date.now();
    if (result.source === "engine") { pollBusy(); return; }
    refresh();
  } catch (e) { alert(e.message); }
}

// Every box the user can draw on the frame. Each layer says where its rectangles

  },
  paste: {
    label: "Papan render", colour: "#7bb26a", multi: false,
    hint: "Tarik kotak tempat papan hasil render ditempel di video. Kosongkan untuk memakai posisi papan overlay yang terdeteksi otomatis. Papan menjaga rasio aslinya dan diletakkan di tengah kotak.",
    get: (s) => (s.paste_rect ? [s.paste_rect] : []),
    save: (rects) => post("paste-rect", { rect: rects[0] || null }),
  },
  logo: {
    label: "Hapus logo", colour: "#e2725b", multi: true,

    get: (s) => s.blur_rects || [],

  },
  brand: {
    label: "Logo saya", colour: "#c9a227", multi: false,

    save: (rects) => post("name-rects", { white: state.name_rects?.white || null, black: rects[0] || null }),

};
let layer = "paste";

// Layout picker for the vertical short: board position + user captions, drawn over
// a preview of the short's own canvas (short-frame) rather than the source frame --
// coordinates here are in SHORT_W x SHORT_H canvas pixels, not source-video pixels.
const SHORT_W = 1080, SHORT_H = 1920;
const SHORT_LAYERS = {
  board: {
    label: "Papan", colour: "#7bb26a", multi: false,
    hint: "Tarik kotak tempat papan diletakkan di video short. Papan menjaga rasio aslinya dan diletakkan di tengah kotak. Kosongkan (hapus kotak) untuk memakai posisi tengah bawaan.",
    get: (s) => (s.short_board_rect ? [s.short_board_rect] : []),

  },
  text: {
    label: "Teks", colour: "#e2b33b", multi: true, withText: true,
    hint: "Semua caption memakai SATU kotak yang sama -- kotak pertama yang kamu tarik. Sesudah itu tinggal isi teks, atur detik & ukurannya, lalu klik \"Tambah teks\"; tidak perlu menarik kotak lagi. Mau memindahkan kotaknya, tarik kotak baru lalu klik \"Pindahkan kotak\" dan semua caption ikut pindah.",
    get: (s) => s.short_texts || [],

let shortLayer = "board";

function post(endpoint, body) {
  return api(`api/projects/${current}/${endpoint}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

function togglePicker() { picking = picking === "board" ? false : "board"; pickAt = null; draw(); }
function toggleLayout() { picking = picking === "layout" ? false : "layout"; pickAt = null; draw(); }
function setLayer(name) { layer = name; pick = null; draw(); }
async function toggleShort() {
  const closing = picking === "short";
  picking = closing ? false : "short";
  pick = null;
  if (closing) {
    clearInterval(spRafId);
    spLoopActive = false; spPlaying = false; spTime = null; spWindowsKey = null;
    spWindows = []; spFramePlies = null; spScrubbing = false; spTextKey = null;
    if (spAudioEl) spAudioEl.pause();
  } else if (!musicList.length) {
    try { musicList = (await api("api/sounds")).music; } catch (e) {}
  }
  draw();
}
function setShortLayer(name) { shortLayer = name; pick = null; draw(); }
function fmtTime(t) {
  if (t === null || t === undefined) return "—";
  const total = Math.max(0, Math.round(t));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
}

function setPickAt(t) { pickAt = Math.round(Math.min(Math.max(t, 0), state.duration || t)); draw(); }
function setPickAtInput() {
  const raw = $("pickattime").value.trim();
  const parts = raw.split(":").map(Number);
  if (parts.some(Number.isNaN) || !parts.length) return;
  const secs = parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0];
  setPickAt(secs);
}

function pickerCard(s) {
  const isLayout = picking === "layout";

      ${fixedSize ? ` Ukuran kotak (${fixedSize[0]}×${fixedSize[1]} px) mengikuti kotak nama satunya —
      klik lalu geser untuk menempatkan, tidak perlu digambar ulang.` : ""}
      ${isLayout && !isZoom && s.source_zoom ? ` Pratinjau di bawah sudah mengikuti zoom
      ${s.source_zoom.percent}% yang diatur di tab Zoom — kotak yang kamu buat di sini otomatis
      dalam skala yang sama.` : ""}</p>
    ${isZoom ? `<div class="row" style="margin-bottom:9px;align-items:center">
      <span class="hint">Persen zoom:</span>
      <input id="zoompercent" type="number" min="100" max="500" step="5"

          ${fmt(t)}</button>`).join("")}
      <input id="pickattime" type="text" placeholder="detik atau mm:ss" value="${at}"
             style="width:90px;font-size:11px;padding:3px 6px"
             onkeydown="if(event.key==='Enter') setPickAtInput()">

    </div>

         user-select:none;-webkit-user-drag:none">
      <img id="pickimg" draggable="false" style="display:block;border-radius:7px;max-width:100%"
           src="api/projects/${current}/frame?t=${at}&width=880${isLayout && !isZoom ? "&zoomed=1" : ""}">
      <div id="pickexisting"></div>
      ${isZoom ? `<div id="zoombox" style="position:absolute;border:2px solid ${spec.colour};

function brandUpload(s) {
  return `<div class="row" style="margin-top:12px;align-items:center">
    <input type="file" id="brandfile" accept="image/png,image/jpeg,image/webp"
           onchange="uploadBrand()" style="font-size:12px">
    ${s.brand_file ? `<img src="api/projects/${current}/file/${s.brand_file}?_=${lookStamp}"
        style="height:34px;border-radius:4px;background:#0003;padding:3px">
      <button onclick="removeBrand()">Hapus logo</button>`
      : `<span class="hint">belum ada logo diunggah</span>`}
  </div>`;
}

async function uploadBrand() {
  const input = $("brandfile");
  if (!input.files?.length) return;
  const body = new FormData();
  body.append("file", input.files[0]);
  try {
    const response = await fetch(`api/projects/${current}/brand`, { method: "POST", body });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
    lookStamp = Date.now();
    refresh();
  } catch (e) { alert(e.message); }
}

async function removeBrand() {
  await api(`api/projects/${current}/brand`, { method: "DELETE" });
  refresh();
}

          <div id="pickexisting"></div>
          <div id="pickbox" style="position:absolute;border:2px solid ${spec.colour};
