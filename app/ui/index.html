<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Konten — Catur</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2b2f38; --ink: #e6e8ec;
    --muted: #8b93a1; --accent: #7bb26a; --warn: #d9a441; --bad: #d96a5f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 230px 1fr; height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  section { overflow-y: auto; padding: 18px 22px; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           padding: 7px 13px; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: #48505f; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10210c;
                   font-weight: 600; }
  input, textarea { width: 100%; background: #0f1114; color: var(--ink);
                    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
                    font: inherit; }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; min-height: 130px; resize: vertical; }
  label { display: block; margin: 12px 0 5px; color: var(--muted); font-size: 12px; }
  .proj { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 3px; }
  .proj:hover { background: var(--panel); }
  .proj.on { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
  .proj b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .proj i { font-style: normal; color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
          padding: 15px; margin-bottom: 15px; }
  pre { background: #0f1114; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        font-size: 11.5px; max-height: 190px; overflow: auto; margin: 0; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       padding: 5px 8px; position: sticky; top: 0; background: var(--panel); }
  td { padding: 4px 8px; border-top: 1px solid var(--line); }
  tr.ply { cursor: pointer; }
  tr.ply:hover td { background: #232830; }
  tr.ply.on td { background: #2c3340; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
  .ok { color: var(--accent); border-color: #34502c; }
  .guess { color: var(--warn); border-color: #5b4820; }
  .edited { color: #6fa8d4; border-color: #274157; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .split img { width: 100%; border-radius: 7px; display: block; background: #0f1114; }
  .split figcaption { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
  .scroll { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
  .err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Asisten Konten — Catur</h1>
  <span id="sub">lokal · 127.0.0.1</span>
</header>
<main>
  <aside>
    <button style="width:100%" onclick="showNew()">+ Proyek baru</button>
    <div id="list" style="margin-top:12px"></div>
  </aside>
  <section id="panel"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null, state = null, selected = null, timer = null, dirty = false;
let picking = false, pick = null;
let quadPoints = [], quadDragIndex = null;
let videoEl = null, rafId = null, rate = 0.5, lookStamp = 0;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
  return response.status === 204 ? null : response.json();
}

async function loadList() {
  const { projects } = await api("/api/projects");
  $("list").innerHTML = projects.map((p) => `
    <div class="proj ${p.id === current ? "on" : ""}" onclick="open_('${p.id}')">
      <b>${escape_(p.name || p.id)}</b><i>${p.status}</i></div>`).join("")
    || `<p class="hint">Belum ada proyek.</p>`;
}

function escape_(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(t) { return t === null || t === undefined ? "—" : Number(t).toFixed(2) + "s"; }

function showNew() {
  current = null; selected = null; clearInterval(timer); loadList();
  $("panel").innerHTML = `
    <div class="card" style="max-width:720px">
      <h2 style="margin:0 0 4px;font-size:15px">Proyek baru</h2>
      <p class="hint">Tempel link video (YouTube, dll) dan PGN pertandingannya. Videonya diunduh otomatis.</p>
      <label>Link video</label>
      <input id="vp" placeholder="https://www.youtube.com/watch?v=...">
      <label>Nama (opsional)</label>
      <input id="nm" placeholder="Carlsen vs Gao">
      <label>PGN</label>
      <textarea id="pg" placeholder="[Event ...]&#10;1. e4 c5 ..."></textarea>
      <div class="row" style="margin-top:14px">
        <button class="primary" onclick="create()">Buat proyek</button>
        <span id="msg" class="err"></span>
      </div>
    </div>`;
}

async function create() {
  $("msg").textContent = "";
  try {
    const { id } = await api("/api/projects", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_url: $("vp").value, name: $("nm").value, pgn_text: $("pg").value }),
    });
    await loadList(); open_(id);
  } catch (e) { $("msg").textContent = e.message; }
}

async function open_(id) {
  if (dirty && !confirm("Ada perubahan waktu yang belum disimpan. Tinggalkan?")) return;
  current = id; selected = null; dirty = false; picking = false; pick = null;
  segStart = null; clearInterval(rafId);
  clearInterval(timer); await refresh(); loadList();
  timer = setInterval(() => { if (state?.busy) refresh(); }, 1500);
}

async function refresh() {
  if (!current) return;
  state = await api(`/api/projects/${current}`);
  draw();
}

function draw() {
  const s = state, busy = s.busy;
  const done = (s.waypoints || []).filter((w) => w.timestamp !== null);
  const observed = done.filter((w) => w.observed).length;
  $("panel").innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0;font-size:15px">${escape_(s.name)}</h2>
          <p class="hint" style="margin:3px 0 0">
            ${escape_(s.white)} — ${escape_(s.black)} · ${s.plies_total} ply ·
            <span style="opacity:.7">${escape_(s.video)}</span></p>
        </div>
        <div class="row">
          <button ${busy ? "disabled" : ""} onclick="run('detect')">
            ${s.waypoints ? "Deteksi ulang" : "Deteksi"}</button>
          <button ${busy ? "disabled" : ""} onclick="togglePicker()">
            ${s.board_quad ? "Ubah papan fisik" : "Pilih papan fisik"}</button>
          <button ${busy ? "disabled" : ""} onclick="toggleLogoPicker()">
            ${(s.logo_rects || []).length ? `Hapus logo (${s.logo_rects.length})` : "Hapus logo"}</button>
          <button ${busy || !s.waypoints || !s.board_quad ? "disabled" : ""}
                  onclick="run('retime')" title="Geser waktu tiap ply mengikuti papan kayu">
            Ikuti papan fisik</button>
          <button class="primary" ${busy || !s.waypoints ? "disabled" : ""} onclick="run('render')">
            Render video</button>
        </div>
      </div>
      <p style="margin:11px 0 0">
        Status: <b>${s.status}</b>${busy ? " · sedang berjalan…" : ""}
        ${s.waypoints ? ` · ${done.length}/${s.plies_total} ply berwaktu ·
           <span class="tag ok">${observed} terbaca langsung</span>` : ""}
        ${s.error ? `<br><span class="err">${escape_(s.error)}</span>` : ""}
      </p>
      ${(s.outputs || []).length ? `<div class="row" style="margin-top:11px">` +
        s.outputs.map((f) => `<a href="/api/projects/${current}/file/${f}" target="_blank"
          style="color:var(--accent)">${f}</a>`).join(" · ") + `</div>` : ""}
    </div>
    ${s.themes ? lookCard(s) : ""}
    ${picking ? pickerCard(s) : ""}
    ${s.log ? `<div class="card"><div class="hint" style="margin-bottom:7px">Log</div>
       <pre id="log">${escape_(s.log)}</pre></div>` : ""}
    ${s.waypoints ? waypointsCard(s) : ""}`;
  if (picking) wirePicker();
  const log = $("log"); if (log) log.scrollTop = log.scrollHeight;
  if (segStart !== null && s.waypoints) showSegment(segStart);
}

function waypointsCard(s) {
  const rows = s.waypoints.map((w) => {
    const tag = w.edited ? `<span class="tag edited">manual</span>`
      : w.source === "physical" ? `<span class="tag ok">papan ${w.shift >= 0 ? "+" : ""}${w.shift}s</span>`
      : w.observed ? `<span class="tag ok">overlay</span>`
      : `<span class="tag guess">tebakan</span>`;
    const flag = w.needs_review ? ` <span class="tag guess">cek</span>` : "";
    const move = `${w.move_number}${w.side === "white" ? "." : "..."} ${escape_(w.san)}`;
    return `<tr class="ply ${selected === w.ply ? "on" : ""}" onclick="showReview(${w.ply})">
      <td style="color:var(--muted)">${w.ply}</td><td>${move}</td>
      <td>${fmt(w.timestamp)}</td><td>${tag}${flag}</td></tr>`;
  }).join("");
  return `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:9px">
        <b style="font-size:13px">Timeline</b>
        <button ${dirty ? "" : "disabled"} onclick="save()">Simpan perubahan</button>
      </div>
      <div class="split">
        <div class="scroll"><table>
          <thead><tr><th>#</th><th>langkah</th><th>waktu</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div id="review"><p class="hint">Klik satu langkah untuk memutar rentang
          ${segLen} detik di sekitarnya.</p></div>
      </div>
    </div>`;
}

function lookCard(s) {
  const ply = Math.min(24, s.plies_total);
  const swatch = (name) => `<button onclick="setLook('theme','${name}')"
      style="padding:4px 10px;font-size:12px;${name === s.theme
        ? "border-color:var(--accent);color:var(--accent)" : ""}">${name}</button>`;
  const setBtn = (name) => `<button onclick="setLook('piece_set','${name}')"
      style="padding:4px 10px;font-size:12px;${name === s.piece_set
        ? "border-color:var(--accent);color:var(--accent)" : ""}">${escape_(name)}</button>`;
  return `<div class="card">
    <div class="row" style="align-items:flex-start;gap:18px">
      <img src="/api/projects/${current}/board?ply=${ply}&width=210&_=${lookStamp}"
           style="width:210px;border-radius:8px;flex:none">
      <div style="flex:1">
        <div class="hint" style="margin-bottom:6px">Warna papan</div>
        <div class="row" style="margin-bottom:12px">${s.themes.map(swatch).join("")}</div>
        <div class="hint" style="margin-bottom:6px">Set bidak</div>
        <div class="row" style="margin-bottom:12px">${s.piece_sets.map(setBtn).join("")}</div>
        <div class="hint" style="margin-bottom:6px">Tambahan</div>
        <div class="row">
          <button onclick="setLook('sound',${!s.sound})" style="padding:4px 10px;font-size:12px;
            ${s.sound ? "border-color:var(--accent);color:var(--accent)" : ""}">
            ${s.sound ? "🔊 suara langkah" : "🔇 tanpa suara"}</button>
          <button onclick="setLook('eval_bar',${!s.eval_bar})" ${s.has_evaluations ? "" : "disabled"}
            style="padding:4px 10px;font-size:12px;
            ${s.eval_bar ? "border-color:var(--accent);color:var(--accent)" : ""}">eval bar</button>
          <button onclick="evaluate()" ${s.busy ? "disabled" : ""}
            style="padding:4px 10px;font-size:12px">Hitung evaluasi</button>
          <span class="hint">${s.has_evaluations ? "evaluasi tersimpan"
            : s.engine ? "engine: " + escape_(s.engine.split(/[\\/]/).pop()) : "belum ada engine"}</span>
        </div>
        <p class="hint" style="margin:12px 0 0">Set bidak tambahan: taruh SVG di
          <code>assets/pieces/&lt;nama&gt;/wK.svg</code> … <code>bP.svg</code>.
          Engine: taruh Stockfish di <code>engines/</code>.</p>
      </div>
    </div>
  </div>`;
}

async function setLook(field, value) {
  await api(`/api/projects/${current}/look`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [field]: value }),
  });
  lookStamp = Date.now();
  refresh();
}

async function evaluate() {
  try {
    const result = await api(`/api/projects/${current}/evaluate`, { method: "POST" });
    lookStamp = Date.now();
    if (result.source === "engine") { run("evaluate"); return; }
    refresh();
  } catch (e) { alert(e.message); }
}

function togglePicker() { picking = picking === "board" ? false : "board"; draw(); }
function toggleLogoPicker() { picking = picking === "logo" ? false : "logo"; draw(); }

function pickerCard(s) {
  const isLogo = picking === "logo";
  const at = Math.round((s.duration || 60) * 0.55);
  const count = (s.logo_rects || []).length;
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b style="font-size:13px">${isLogo ? "Area logo" : "Area papan fisik"}</b>
      <span class="hint">${isLogo ? `${count} kotak`
        : (s.board_quad ? "4 sudut tersimpan" : "belum dipilih")}</span>
    </div>
    <p class="hint" style="margin:0 0 9px">${isLogo
      ? "Tarik kotak di atas tiap logo/watermark yang mau dihilangkan dari full-video. Bisa lebih dari satu; klik × untuk hapus satu kotak."
      : "Klik 4 sudut papan kayu searah jarum jam: kiri-atas, kanan-atas, kanan-bawah, kiri-bawah. Setelah 4 titik, tarik titiknya biar pas mengikuti sudut miring kamera. Jangan ikutkan pemain, jam, atau papan digital."}</p>
    <div id="pickwrap" style="position:relative;display:inline-block;cursor:crosshair;
         user-select:none;-webkit-user-drag:none">
      <img id="pickimg" draggable="false" style="display:block;border-radius:7px;max-width:100%"
           src="/api/projects/${current}/frame?t=${at}&width=880">
      <div id="pickexisting"></div>
      ${isLogo ? `<div id="pickbox" style="position:absolute;border:2px solid var(--accent);
           background:rgba(123,178,106,.16);display:none;pointer-events:none"></div>` : `
      <svg id="pickpoly" style="position:absolute;left:0;top:0;pointer-events:none" width="100%" height="100%">
        <polygon id="pickpolygon" points="" fill="rgba(123,178,106,.18)" stroke="var(--accent)" stroke-width="2"></polygon>
      </svg>
      <div id="pickhandles"></div>`}
    </div>
    <div class="row" style="margin-top:10px">
      ${isLogo
        ? `<button class="primary" id="pickok" disabled onclick="addLogoRect()">Tambah kotak</button>`
        : `<button class="primary" id="quadok" disabled onclick="saveQuad()">Simpan area</button>
           <button onclick="resetQuad()">Ulang dari awal</button>
           <button onclick="clearQuad()">Hapus area</button>`}
      <button onclick="${isLogo ? "toggleLogoPicker" : "togglePicker"}()">Tutup</button>
      <span id="pickmsg" class="hint"></span>
    </div>
  </div>`;
}

function wirePicker() {
  if (picking === "logo") wireLogoPicker(); else wireQuadPicker();
}

function wireLogoPicker() {
  const wrap = $("pickwrap"), box = $("pickbox"), img = $("pickimg");
  let start = null;
  const at = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const place = (a, b) => {
    box.style.display = "block";
    box.style.left = Math.min(a[0], b[0]) + "px";
    box.style.top = Math.min(a[1], b[1]) + "px";
    box.style.width = Math.abs(a[0] - b[0]) + "px";
    box.style.height = Math.abs(a[1] - b[1]) + "px";
  };
  wrap.onmousedown = (e) => { start = at(e); pick = null; $("pickok").disabled = true; e.preventDefault(); };
  wrap.onmousemove = (e) => { if (start) place(start, at(e)); };
  window.onmouseup = (e) => {
    if (!start) return;
    const end = at(e), scale = state.width / img.clientWidth;
    const rect = [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
                  Math.abs(start[0] - end[0]), Math.abs(start[1] - end[1])];
    start = null;
    if (rect[2] < 12 || rect[3] < 12) { box.style.display = "none"; return; }
    pick = rect.map((v) => Math.round(v * scale));
    $("pickok").disabled = false;
    $("pickmsg").textContent = `${pick[2]}×${pick[3]} px`;
  };
  if (img.complete) drawExistingRects();
  else img.onload = drawExistingRects;
}

function drawExistingRects() {
  const img = $("pickimg"), host = $("pickexisting");
  if (!img || !host) return;
  const scale = img.clientWidth / state.width;
  const rects = state.logo_rects || [];
  host.innerHTML = rects.map((r, i) => `
    <div style="position:absolute;left:${r[0] * scale}px;top:${r[1] * scale}px;
         width:${r[2] * scale}px;height:${r[3] * scale}px;border:2px solid #e2725b;
         background:rgba(226,114,91,.18)">
      <button onclick="removeLogoRect(${i})" title="Hapus kotak ini"
         style="position:absolute;top:-11px;right:-11px;width:20px;height:20px;padding:0;
         border-radius:50%;font-size:11px;line-height:1;cursor:pointer">×</button>
    </div>`).join("");
}

// Board corners: click 4 points to place, then drag any of them to follow the
// camera's angle on the board instead of forcing an axis-aligned box.
function wireQuadPicker() {
  const wrap = $("pickwrap"), img = $("pickimg");
  const toLocal = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const nearestHandle = (p) => {
    let best = null, bestDist = 16;
    quadPoints.forEach((q, i) => {
      const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  };
  const init = () => {
    const scale = img.clientWidth / state.width;
    quadPoints = state.board_quad ? state.board_quad.map(([x, y]) => [x * scale, y * scale]) : [];
    quadDragIndex = null;
    renderQuad();
  };
  wrap.onclick = (e) => {
    if (quadPoints.length >= 4) return;
    quadPoints.push(toLocal(e));
    renderQuad();
  };
  wrap.onmousedown = (e) => {
    if (quadPoints.length < 4) return;
    const idx = nearestHandle(toLocal(e));
    if (idx !== null) { quadDragIndex = idx; e.preventDefault(); }
  };
  window.onmousemove = (e) => {
    if (quadDragIndex === null) return;
    quadPoints[quadDragIndex] = toLocal(e);
    renderQuad();
  };
  window.onmouseup = () => { quadDragIndex = null; };
  if (img.complete) init(); else img.onload = init;
}

function renderQuad() {
  const poly = $("pickpolygon"), host = $("pickhandles"), ok = $("quadok"), msg = $("pickmsg");
  if (!poly || !host) return;
  poly.setAttribute("points", quadPoints.map((p) => p.join(",")).join(" "));
  host.innerHTML = quadPoints.map((p) => `
    <div style="position:absolute;left:${p[0] - 6}px;top:${p[1] - 6}px;width:12px;height:12px;
         border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:grab"></div>`).join("");
  if (ok) ok.disabled = quadPoints.length !== 4;
  if (msg) msg.textContent = quadPoints.length < 4
    ? `${quadPoints.length}/4 titik` : "tarik titik untuk menyesuaikan";
}

function resetQuad() { quadPoints = []; renderQuad(); }

async function saveQuad() {
  if (quadPoints.length !== 4) return;
  const img = $("pickimg"), scale = state.width / img.clientWidth;
  const quad = quadPoints.map(([x, y]) => [Math.round(x * scale), Math.round(y * scale)]);
  await api(`/api/projects/${current}/board-quad`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quad }),
  });
  picking = false; refresh();
}

async function clearQuad() {
  await api(`/api/projects/${current}/board-quad`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quad: null }),
  });
  quadPoints = []; refresh();
}

async function addLogoRect() {
  if (!pick) return;
  const rects = [...(state.logo_rects || []), pick];
  await api(`/api/projects/${current}/logo-rects`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rects }),
  });
  pick = null; refresh();
}

async function removeLogoRect(index) {
  const rects = (state.logo_rects || []).filter((_, i) => i !== index);
  await api(`/api/projects/${current}/logo-rects`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rects }),
  });
  refresh();
}

// A single ply is far too short to judge in blitz, so the player reviews a slice
// of timeline at a time and the board steps through every move inside it.
let segLen = 10, segStart = null;

function ensureVideo() {
  if (!videoEl) {
    videoEl = document.createElement("video");
    videoEl.muted = true; videoEl.playsInline = true; videoEl.preload = "auto";
    videoEl.autoplay = true; videoEl.controls = true;
    videoEl.style.cssText = "width:100%;border-radius:7px;display:block;background:#000";
  }
  const src = `/api/projects/${current}/video`;
  if (videoEl.dataset.project !== current) {
    videoEl.dataset.project = current; videoEl.src = src;
  }
  return videoEl;
}

function timed() { return (state.waypoints || []).filter((w) => w.timestamp !== null); }
function inSegment(start) {
  return timed().filter((w) => w.timestamp >= start && w.timestamp < start + segLen);
}
function baselinePly(start) {
  const earlier = timed().filter((w) => w.timestamp < start);
  return earlier.length ? earlier[earlier.length - 1].ply : 0;
}

function showReview(ply) {                       // called from the ply table
  selected = ply;
  const w = state.waypoints.find((x) => x.ply === ply);
  if (!w || w.timestamp === null) return;
  showSegment(Math.max(0, Math.floor(w.timestamp / segLen) * segLen));
}

function stepSegment(delta) {
  showSegment(Math.max(0, (segStart ?? 0) + delta * segLen));
}

function setSegLen(value) {
  const anchor = selected !== null
    ? (state.waypoints.find((x) => x.ply === selected) || {}).timestamp ?? segStart : segStart;
  segLen = value;
  showSegment(Math.max(0, Math.floor((anchor ?? 0) / segLen) * segLen));
}

function showSegment(start) {
  segStart = start;
  const list = inSegment(start);
  const base = baselinePly(start);
  if (selected === null || !list.some((w) => w.ply === selected)) {
    selected = list.length ? list[0].ply : null;
  }
  document.querySelectorAll("tr.ply").forEach((tr) => tr.classList.toggle(
    "on", list.some((w) => String(w.ply) === tr.firstElementChild.textContent)));

  const boards = [base, ...list.map((w) => w.ply)].map((p, index) =>
    `<img class="rvBoard" data-ply="${p}"
       src="/api/projects/${current}/board?ply=${p}&width=420&_=${lookStamp}"
       style="${index ? "position:absolute;inset:0;" : ""}opacity:${index ? 0 : 1}">`).join("");
  const marks = list.map((w) => `<div class="rvMark" data-ply="${w.ply}"
       style="position:absolute;top:0;bottom:0;width:2px;background:var(--warn);
       left:${((w.timestamp - start) / segLen) * 100}%"></div>`).join("");
  const chips = list.map((w) => {
    const flag = w.needs_review ? " ⚠" : "";
    return `<button class="chip" data-ply="${w.ply}" onclick="pickPly(${w.ply})"
      style="padding:4px 9px;font-size:12px">${w.move_number}${w.side === "white" ? "." : "…"}${escape_(w.san)}
      <span style="color:var(--muted)">${w.timestamp.toFixed(2)}${flag}</span></button>`;
  }).join("") || `<span class="hint">Tidak ada langkah di rentang ini.</span>`;

  $("review").innerHTML = `
    <div class="row" style="margin-bottom:8px;justify-content:space-between">
      <div class="row">
        <button onclick="stepSegment(-1)">←</button>
        <b>${start.toFixed(0)}–${(start + segLen).toFixed(0)}s</b>
        <button onclick="stepSegment(1)">→</button>
        <span class="hint">${list.length} langkah</span>
      </div>
      <div class="row">
        ${[10, 20, 30].map((v) => `<button onclick="setSegLen(${v})" id="seg${v}"
            style="padding:4px 8px;font-size:12px">${v}s</button>`).join("")}
      </div>
    </div>
    <div class="split">
      <figure style="margin:0" id="rvLeft"><figcaption>video sumber</figcaption></figure>
      <figure style="margin:0"><figcaption>papan hasil — <span id="rvNow">…</span></figcaption>
        <div style="position:relative">${boards}</div></figure>
    </div>
    <div style="position:relative;height:6px;border-radius:3px;background:#0f1114;
         margin:10px 0 9px">
      <div id="rvFill" style="position:absolute;inset:0 100% 0 0;background:#3d4654;
           border-radius:3px"></div>${marks}
    </div>
    <div class="row" style="margin-bottom:9px">${chips}</div>
    <div class="row">
      ${[-2, -1, -0.25, 0.25, 1, 2].map((d) =>
        `<button onclick="nudgeSelected(${d})">${d > 0 ? "+" : ""}${d}s</button>`).join("")}
      <span style="flex:1"></span>
      ${[0.25, 0.5, 1].map((r) =>
        `<button onclick="setRate(${r})" id="rate${String(r).replace(".", "")}"
           style="padding:4px 8px;font-size:12px">${r}×</button>`).join("")}
    </div>
    <p class="hint" style="margin-top:8px">Video berputar sepanjang rentang ini dan papan kanan
      ikut melangkah. Garis kuning = titik pergantian. Pilih langkah di atas lalu geser:
      pemain jalan duluan → kurangi; papan berganti duluan → tambah.</p>`;

  $("rvLeft").appendChild(ensureVideo());
  const active = $("seg" + segLen); if (active) active.style.borderColor = "var(--accent)";
  markChip();
  setRate(rate);
  startLoop();
}

function pickPly(ply) { selected = ply; markChip(); }

function markChip() {
  document.querySelectorAll(".chip").forEach((b) => {
    b.style.borderColor = Number(b.dataset.ply) === selected ? "var(--accent)" : "";
  });
}

function setRate(value) {
  rate = value;
  if (videoEl) videoEl.playbackRate = value;
  [0.25, 0.5, 1].forEach((r) => {
    const b = $("rate" + String(r).replace(".", ""));
    if (b) b.style.borderColor = r === value ? "var(--accent)" : "";
  });
}

function startLoop() {
  clearInterval(rafId);
  if (!videoEl || segStart === null) return;
  const rewind = () => {
    try { videoEl.currentTime = segStart; } catch {}
    videoEl.play().catch(() => {});
  };
  if (videoEl.readyState >= 1) rewind();
  else videoEl.addEventListener("loadedmetadata", rewind, { once: true });

  const tick = () => {
    if (!videoEl.isConnected) { clearInterval(rafId); return; }
    const now = videoEl.currentTime;
    // never re-seek while one is already in flight, or the loop never gets to play
    if (!videoEl.seeking && (now >= segStart + segLen || now < segStart - 0.5)) {
      videoEl.currentTime = segStart;
      videoEl.play().catch(() => {});
      return;
    }
    const list = inSegment(segStart);
    let shown = baselinePly(segStart), label = "sebelum langkah";
    for (const w of list) {
      if (now >= w.timestamp) {
        shown = w.ply;
        label = `${w.move_number}${w.side === "white" ? "." : "…"}${w.san}`;
      }
    }
    document.querySelectorAll(".rvBoard").forEach((img) => {
      img.style.opacity = Number(img.dataset.ply) === shown ? 1 : 0;
    });
    const now_ = $("rvNow"); if (now_) now_.textContent = label;
    const fill = $("rvFill");
    if (fill) fill.style.right = (100 - Math.min(100, Math.max(0,
      ((now - segStart) / segLen) * 100))) + "%";
  };
  rafId = setInterval(tick, 40);
  tick();
}

function nudgeSelected(delta) {
  if (selected === null) return;
  const w = state.waypoints.find((x) => x.ply === selected);
  if (!w || w.timestamp === null) return;
  w.timestamp = Math.max(0, Math.round((w.timestamp + delta) * 1000) / 1000);
  w.edited = true; w.source = "manual"; w.needs_review = false; dirty = true;

  // patch in place so the player keeps running
  const chip = document.querySelector(`.chip[data-ply="${w.ply}"] span`);
  if (chip) chip.textContent = w.timestamp.toFixed(2);
  const mark = document.querySelector(`.rvMark[data-ply="${w.ply}"]`);
  if (mark) mark.style.left = ((w.timestamp - segStart) / segLen) * 100 + "%";
  const row = [...document.querySelectorAll("tr.ply")].find(
    (tr) => tr.firstElementChild.textContent === String(w.ply));
  if (row) {
    row.children[2].textContent = fmt(w.timestamp);
    row.children[3].innerHTML = `<span class="tag edited">manual</span>`;
  }
  const save = [...document.querySelectorAll("button")].find(
    (b) => b.textContent === "Simpan perubahan");
  if (save) save.disabled = false;
}

async function save() {
  await api(`/api/projects/${current}/waypoints`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ waypoints: state.waypoints.map((w) => ({ ply: w.ply, timestamp: w.timestamp })) }),
  });
  dirty = false; refresh();
}

async function run(what) {
  picking = false;
  await api(`/api/projects/${current}/${what}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: what === "render" ? JSON.stringify({ full_video: true }) : "{}",
  });
  refresh();
  clearInterval(timer);
  // poll only while work is running, otherwise a redraw would interrupt the review player
  timer = setInterval(async () => {
    await refresh();
    if (!state?.busy) clearInterval(timer);
  }, 1500);
}

loadList().then(() => showNew());
</script>
</body>
</html>
