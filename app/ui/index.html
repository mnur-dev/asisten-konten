function musicCard(s) {
  const track = musicList.find((m) => m.name === s.short_music);
  const duration = track?.duration || 0;
  const offset = s.short_music_offset || 0;
  return `<div class="card">
    <b style="font-size:13px">Musik latar</b>
    <p class="hint" style="margin:6px 0 9px">Pilih lagu, lalu geser slidernya buat nentuin lagu mulai
      diputar dari detik/menit berapa. Klik ▶ buat dengar langsung sebelum disimpan. Taruh file lagu
      di <code>assets/sounds/</code> supaya muncul di daftar.</p>
    <div class="row" style="margin-bottom:9px">
      <select id="musicSelect" onchange="setMusicName(this.value)">
        <option value="">(tanpa musik)</option>
        ${musicList.map((m) => `<option value="${escape_(m.name)}" ${m.name === s.short_music ? "selected" : ""}>
          ${escape_(m.name)} · ${fmtTime(m.duration)}</option>`).join("")}
      </select>
      <button onclick="toggleMusicPreview()" ${s.short_music ? "" : "disabled"}>▶ Dengar</button>
    </div>
    ${s.short_music ? `<div class="row" style="align-items:center;gap:9px">
      <input id="musicOffset" type="range" min="0" max="${Math.max(1, duration - 1)}" step="0.1"
             value="${offset}" style="flex:1" oninput="scrubMusic(this.value)"
             onchange="saveMusicOffset(this.value)">
      <span id="musicTime" class="hint" style="width:80px">${fmtTime(offset)} / ${fmtTime(duration)}</span>
    </div>
    <audio id="musicPlayer" src="api/sounds/${encodeURIComponent(s.short_music)}" preload="none"></audio>` : ""}
  </div>`;
}

async function setMusicName(name) {
  try {
    await post("short-music", { name: name || null, offset: 0 });
    refresh();
  } catch (e) { alert(e.message); }
}

function scrubMusic(value) {
  const time = $("musicTime"), player = $("musicPlayer");
  const duration = musicList.find((m) => m.name === state.short_music)?.duration || 0;
  if (time) time.textContent = `${fmtTime(Number(value))} / ${fmtTime(duration)}`;
  if (player) player.currentTime = Number(value);
}

async function saveMusicOffset(value) {
  state.short_music_offset = Number(value);
  try {
    await post("short-music", { name: state.short_music, offset: Number(value) });
  } catch (e) { alert(e.message); }
}

function toggleMusicPreview() {
  const player = $("musicPlayer");
  if (!player) return;
  if (player.paused) {
    player.currentTime = state.short_music_offset || 0;
    player.play();
  } else {
    player.pause();
  }
}

function shortParams() { return { ...shortOpts }; }

// No save button: runRender() posts this just before it renders, the same way
// runShort() saves the cut first, so the box can never quietly render at an old value.
function setLeadIn(value) {
  const number = parseFloat(value);
  leadIn = Math.max(0, isFinite(number) ? number : 0);
  refreshWindowButton();
}

// "mulai −" / "selesai +" for the long video, under the preview whose slider they
// bound. Saved on change (and again just before a render), so a reload keeps them.
function windowInputs() {
  const group = "display:inline-flex;align-items:center;gap:6px;white-space:nowrap";
  return `<div class="row" style="margin-top:8px;gap:8px 16px">
    <span style="${group}"><span class="hint">Mulai −</span>
      <input id="leadIn" type="number" min="0" step="5" value="${leadIn}"
             title="Detik siaran sebelum langkah pertama. 0 = video langsung mulai di langkah 1; 60 = mulai satu menit sebelumnya."
             style="width:64px;padding:5px 6px" oninput="setLeadIn(this.value)" onkeydown="if(event.key==='Enter') saveWindow()">
      <span class="hint">dtk sebelum langkah 1</span></span>
    <span style="${group}"><span class="hint">Selesai +</span>
      <input id="outro" type="number" min="0" step="5" value="${outro}"
             title="Detik siaran setelah langkah terakhir. 0 = video berhenti tepat di langkah terakhir; 60 = satu menit sesudahnya (papan terakhir tetap tampil)."
             style="width:64px;padding:5px 6px" oninput="setOutro(this.value)" onkeydown="if(event.key==='Enter') saveWindow()">
      <span class="hint">dtk setelah langkah terakhir</span></span>
    <button id="windowSave" ${windowDirty() ? 'class="primary"' : "disabled"} onclick="saveWindow()"
            title="Simpan mulai & selesai; preview langsung menyesuaikan">
      ${windowDirty() ? "Simpan" : "Tersimpan"}</button>
  </div>`;
}

function windowDirty() {
  return !!state && (leadIn !== (state.lead_in ?? 0) || outro !== (state.outro ?? 60));
}
function refreshWindowButton() {
  const button = $("windowSave");
  if (!button) return;
  const dirty = windowDirty();
  button.disabled = !dirty;
  button.className = dirty ? "primary" : "";
  button.textContent = dirty ? "Simpan" : "Tersimpan";
}

// Both values in one go, then a full refresh so the preview's slider, the
// "di video jadi" line and the stop/start hints all re-fit to what was saved.
async function saveWindow() {
  try {
    await post("lead-in", { seconds: leadIn });
    await post("outro", { seconds: outro });
    await refresh();
  } catch (e) { alert(e.message); }
}

function setOutro(value) {
  const number = parseFloat(value);
  outro = Math.max(0, isFinite(number) ? number : 0);
  refreshWindowButton();
}

function shortOptsDirty(s) {
  return shortOpts.plies !== (s.short_plies ?? 20)
      || shortOpts.pad !== (s.short_pad ?? 1)
      || shortOpts.tail !== (s.short_tail ?? 0);
}

// Persist the cut onto the project. Everything that quotes a duration -- the
// estimate, the caption timing table, both render buttons -- then works off one
// stored number instead of whatever happened to be typed in the boxes.
async function saveShortOpts() {
  try {
    await post("short-cut", { plies: shortOpts.plies, pad: shortOpts.pad, tail: shortOpts.tail });
    refresh();
  } catch (e) { alert(e.message); }
}

// One handler for all three boxes. The estimate follows every keystroke, but the
// preview only catches up once typing settles -- rebuilding it re-fetches the
// backdrop frame and every board position, which is far too much for each digit.
function setShortOpt(key, value) {
  const number = parseFloat(value);
  if (key === "plies") shortOpts.plies = Math.max(1, parseInt(value, 10) || 1);
  else if (key === "pad") shortOpts.pad = Math.max(0.1, isFinite(number) ? number : 1);
  else shortOpts.tail = Math.max(0, isFinite(number) ? number : 0);
  updateShortEstimate();
  refreshCutButton();
  clearTimeout(spOptsTimer);
  spOptsTimer = setTimeout(applyShortOptions, 350);
}

// Typing doesn't redraw the panel (that would steal focus mid-keystroke), so the
// save button has to be re-styled in place as the draft drifts from what's stored.
function refreshCutButton() {
  const button = $("shortSave");
  if (!button || !state) return;
  const dirty = shortOptsDirty(state);
  button.disabled = !!state.busy || !dirty;
  button.className = dirty ? "primary" : "";
  button.textContent = dirty ? "Simpan durasi" : "Tersimpan";
}

// Pushes the current plies/pad/tail into the open preview: a different ply count
// means a different reference frame for the backdrop, and any of the three means
// a different set of windows.
function applyShortOptions() {
  if (picking !== "short") return;
  const { plies } = shortOpts;
  if (plies !== spFramePlies) {
    const stamp = Date.now();
    const backdrop = $("spBackdrop"), pickimg = $("pickimg");
    if (backdrop) backdrop.src = `api/projects/${current}/short-frame?plies=${plies}&width=300&_=${stamp}`;
    if (pickimg) {
      pickimg.onload = drawExistingShort;
      pickimg.src = `api/projects/${current}/short-frame?plies=${plies}&width=380&_=${stamp}`;
    }
  }
  wireShortPreview();
}

// Jump-cut math mirroring core/render.py's short_windows(): a `pad`-second window
// around each of the last `plies` plies, merged where they overlap, with `tail`
// extra seconds on the final one -- keep these two in sync if that changes. Doing
// this client-side means the duration estimate and the browser preview both update
// instantly, with no round trip to the server.
function computeShortWindows(plies, pad, tail = 0) {
  const timed = (state?.waypoints || []).filter((w) => w.timestamp !== null);
  const included = plies > 0 ? timed.slice(-plies) : timed;
  const raw = included.map((w) => [Math.max(0, w.timestamp - pad), w.timestamp + pad])
    .sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [s, e] of raw) {
    if (merged.length && s <= merged[merged.length - 1][1]) {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
    } else {
      merged.push([s, e]);
    }
  }
  if (merged.length && tail > 0) merged[merged.length - 1][1] += tail;
  const limit = state?.duration;
  if (merged.length && limit) {
    return merged.filter(([a]) => a < limit).map(([a, b]) => [a, Math.min(b, limit)]);
  }
  return merged;
}

function estimateShortDuration(plies, pad, tail) {
  return computeShortWindows(plies, pad, tail).reduce((sum, [s, e]) => sum + (e - s), 0);
}

function updateShortEstimate() {
  const el = $("shortEstimate");
  if (!el || !state?.waypoints) return;
  const { plies, pad, tail } = shortParams();
  const dur = estimateShortDuration(plies, pad, tail);
  el.textContent = `≈ ${fmtTime(dur)}`;
  el.style.color = dur > 50 ? "var(--warn)" : "var(--accent)";
}

// Browser-side preview of the short, before spending time on a real ffmpeg render:
// video + board + captions + music played together, roughly positioned the same
// way short_clip() composites them server-side (core/render.py's SHORT_TEXT_GAP,
// SHORT_BOTTOM_MARGIN, SHORT_BOARD_WIDTH -- keep these two in sync if those change).
function defaultBoardRect() {
  const topH = Math.round(SHORT_W * state.height / state.width / 2) * 2;
  const gap = Math.round(SHORT_H * 0.09), bottomMargin = Math.round(SHORT_H * 0.04);
  const boardY = topH + gap, boardW = Math.round(SHORT_W * 0.70);
  const boardH = Math.max(10, SHORT_H - boardY - bottomMargin);
  return [Math.round((SHORT_W - boardW) / 2), boardY, boardW, boardH];
}

function ensureShortAudio() {
  if (!spAudioEl) spAudioEl = document.createElement("audio");
  return spAudioEl;
}

// The same pop the render mixes in at each caption start (assets/sounds/pop.mp3),
// so the preview's timing can be judged by ear and not just by eye. Cloned per
// hit because two captions can start close enough together that one element would
// cut its own previous play short.
function playCaptionPop() {
  if (!state?.caption_pop) return;
  if (!spPopEl) {
    spPopEl = new Audio(`api/sounds/${encodeURIComponent(state.caption_pop)}`);
    spPopEl.preload = "auto";
  }
  const shot = spPopEl.cloneNode();
  shot.volume = 0.9;
  shot.play().catch(() => {});
}

// Runs on every redraw now that layout editing and preview share one card --
// dragging a box in the picker calls refresh() just like everything else there,
// so the loop is handed the previous playback position (spTime/spPlaying) and
// picks up where it left off instead of restarting on each tiny edit. Changing
// plies/pad/tail does restart it, since that genuinely rebuilds the window list.
function wireShortPreview() {
  const wrap = $("shortPreviewWrap");
  if (!wrap) return;

  const { plies, pad, tail } = shortParams();
  const windows = computeShortWindows(plies, pad, tail);
  const included = (state.waypoints || []).filter((w) => w.timestamp !== null)
    .slice(plies > 0 ? -plies : 0);

  const scale = wrap.clientWidth / SHORT_W;
  const [bx, by, bw, bh] = state.short_board_rect || defaultBoardRect();
  const boardHost = $("spBoards");
  boardHost.style.cssText = `position:absolute;left:${bx * scale}px;top:${by * scale}px;
      width:${bw * scale}px;height:${bh * scale}px`;

  // preload the position right before AND right after each included ply, so the
  // board can flip between them the instant playback crosses that ply's timestamp
  const neededPlies = new Set();
  included.forEach((w) => { neededPlies.add(Math.max(0, w.ply - 1)); neededPlies.add(w.ply); });
  boardHost.innerHTML = "";
  [...neededPlies].sort((a, b) => a - b).forEach((p) => {
    const img = document.createElement("img");
    img.className = "spBoard"; img.dataset.ply = p;
    img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0";
    img.src = `api/projects/${current}/board?ply=${p}&width=500&_=${lookStamp}`;
    boardHost.appendChild(img);
  });

  // One caption image per timing group. The cache-buster is derived from the
  // captions themselves, not the clock, so a redraw re-uses the cached images
  // instead of re-fetching and blinking. The host is rebuilt whenever it no longer
  // holds the right number of layers -- draw() hands us a brand new empty div on
  // every redraw, so comparing the key alone would leave the captions missing.
  const textGroups = shortTextGroups(state.short_texts);
  const textKey = JSON.stringify(state.short_texts || []);
  const textHost = $("spTexts");
  if (textHost && (textKey !== spTextKey || textHost.childElementCount !== textGroups.length)) {
    spTextKey = textKey;
    const stamp = [...textKey].reduce((hash, ch) => (hash * 31 + ch.charCodeAt(0)) | 0, 7);
    textHost.innerHTML = "";
    textGroups.forEach((group) => {
      const img = document.createElement("img");
      img.className = "spText";
      img.dataset.start = group.start;
      img.dataset.end = group.end === null ? "" : group.end;
      img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;opacity:0";
      img.src = `api/projects/${current}/short-text-preview?width=300`
        + `&only=${group.indices.join(",")}&_=${stamp}`;
      textHost.appendChild(img);
    });
  }

  spFramePlies = plies;
  wireShortScrub();

  // same windows across a redraw -> carry the playhead over; different windows
  // (plies/pad/tail changed) -> start the new cut from the top
  const windowsKey = JSON.stringify(windows);
  const resume = windowsKey === spWindowsKey;
  spWindowsKey = windowsKey;
  startShortPreviewLoop(windows, resume);
}

function shortPreviewDuration() {
  return spWindows.reduce((sum, [a, b]) => sum + (b - a), 0);
}

// Elapsed time in the *cut* (what the viewer of short.mp4 sees) -> the source
// timestamp that plays there. The windows are contiguous in the output but
// scattered across the broadcast, so scrubbing has to walk them in order.
function seekShortPreview(elapsed) {
  const video = $("spVideo");
  if (!video || !spWindows.length) return;
  const total = shortPreviewDuration();
  let left = Math.min(Math.max(0, elapsed), Math.max(0, total - 0.05));
  let index = spWindows.length - 1;
  for (let i = 0; i < spWindows.length; i++) {
    const span = spWindows[i][1] - spWindows[i][0];
    if (left < span) { index = i; break; }
    if (i < spWindows.length - 1) left -= span;
  }
  const span = spWindows[index][1] - spWindows[index][0];
  left = Math.min(left, Math.max(0, span - 0.05));
  spIdx = index;
  spLastElapsed = elapsed;                  // no pops for windows the scrub skipped
  spTime = spWindows[index][0] + left;
  try { video.currentTime = spTime; } catch {}
  if (spAudioEl && state.short_music) {
    try { spAudioEl.currentTime = (state.short_music_offset || 0) + elapsed; } catch {}
  }
  paintShortProgress(elapsed, total);
}

function paintShortProgress(elapsed, total) {
  const percent = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0;
  const fill = $("spFill"), handle = $("spHandle"), label = $("spTime");
  if (fill) fill.style.width = percent + "%";
  if (handle) handle.style.left = percent + "%";
  if (label) label.textContent = `${fmtTime(elapsed)} / ${fmtTime(total)}`;
}

// Dragging works paused as well as playing: the tick loop reads the video's own
// currentTime, so it just picks up wherever the scrub put it.
function wireShortScrub() {
  const bar = $("spBar");
  if (!bar) return;
  const seekAt = (event) => {
    const box = bar.getBoundingClientRect();
    if (!box.width) return;
    const fraction = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
    seekShortPreview(fraction * shortPreviewDuration());
  };
  bar.onpointerdown = (event) => {
    spScrubbing = true;
    try { bar.setPointerCapture(event.pointerId); } catch {}
    seekAt(event);
    event.preventDefault();
  };
  bar.onpointermove = (event) => { if (spScrubbing) seekAt(event); };
  const release = (event) => {
    if (!spScrubbing) return;
    spScrubbing = false;
    try { bar.releasePointerCapture(event.pointerId); } catch {}
  };
  bar.onpointerup = release;
  bar.onpointercancel = release;
}

// Mirrors what short_clip() actually renders: rather than playing straight through,
// playback jumps from window to window (skipping the "thinking time" between
// moves), so the preview's pacing matches the real output instead of just showing
// the untouched broadcast.
function startShortPreviewLoop(windows, resume = false) {
  clearInterval(spRafId);
  spLoopActive = false;
  spWindows = windows;
  const video = $("spVideo");
  if (!video || !windows.length) return;
  spLoopActive = true;
  const music = state.short_music ? ensureShortAudio() : null;
  if (music) {
    const src = `api/sounds/${encodeURIComponent(state.short_music)}`;
    if (music.dataset.src !== src) { music.dataset.src = src; music.src = src; }
  }
  const totalDuration = shortPreviewDuration();
  // resuming: drop back into whichever window the old playhead was inside
  spIdx = 0;
  if (resume && spTime !== null) {
    const found = windows.findIndex(([a, b]) => spTime >= a && spTime < b);
    if (found >= 0) spIdx = found;
  }
  const seekTo = (i, at = null) => {
    spIdx = i;
    try { video.currentTime = at !== null ? at : windows[spIdx][0]; } catch {}
  };
  const start = () => {
    if (!resume) spLastElapsed = -1;        // a caption at 0s still gets its pop
    seekTo(spIdx, resume && spTime !== null ? spTime : null);
    if (!resume && music) { try { music.currentTime = state.short_music_offset || 0; } catch {} }
    if (spPlaying) {
      video.play().catch(() => {});
      if (music) music.play().catch(() => {});
    }
    const button = $("spPlay");
    if (button) button.textContent = spPlaying ? "⏸ Jeda" : "▶ Putar";
  };
  if (video.readyState >= 1) start();
  else video.addEventListener("loadedmetadata", start, { once: true });

  const tick = () => {
    if (!video.isConnected) { clearInterval(spRafId); spLoopActive = false; return; }
    const now = video.currentTime;
    spTime = now;
    // hands off while the user drags the bar -- seekShortPreview owns spIdx then
    if (!spScrubbing && !video.seeking &&
        (now >= windows[spIdx][1] || now < windows[spIdx][0] - 0.5)) {
      const next = spIdx + 1 < windows.length ? spIdx + 1 : 0;
      if (next === 0) {
        spLastElapsed = -1;               // looping back: a caption at 0s pops again
        if (music) { try { music.currentTime = state.short_music_offset || 0; } catch {} }
      }
      seekTo(next);
      return;
    }
    let elapsed = 0;
    for (let i = 0; i < spIdx; i++) elapsed += windows[i][1] - windows[i][0];
    elapsed += Math.max(0, now - windows[spIdx][0]);

    let shown = 0;
    for (const w of state.waypoints || []) {
      if (w.timestamp !== null && w.timestamp <= now) shown = w.ply;
    }
    document.querySelectorAll(".spBoard").forEach((img) => {
      img.style.opacity = Number(img.dataset.ply) === shown ? 1 : 0;
    });
    document.querySelectorAll(".spText").forEach((img) => {
      const from = Number(img.dataset.start) || 0;
      const until = img.dataset.end === "" ? Infinity : Number(img.dataset.end);
      img.style.opacity = elapsed >= from && elapsed <= until ? 1 : 0;
      // only while actually playing forward: a scrub or a paused nudge would
      // otherwise fire a pop on every tick it happened to straddle
      if (spPlaying && !spScrubbing && spLastElapsed < from && elapsed >= from) playCaptionPop();
    });
    spLastElapsed = elapsed;
    // while dragging, the bar is already painted by seekShortPreview from the
    // pointer position -- repainting from a currentTime that hasn't landed yet
    // would make the handle stutter backwards under the cursor
    if (!spScrubbing) paintShortProgress(elapsed, totalDuration);
    if (music && !music.seeking && !spScrubbing) {
      const target = (state.short_music_offset || 0) + elapsed;
      if (Math.abs(music.currentTime - target) > 0.35) music.currentTime = target;
    }
  };
  spRafId = setInterval(tick, 40);
  tick();
}

function toggleShortPreviewPlay() {
  const video = $("spVideo");
  if (!video) return;
  const button = $("spPlay");
  spPlaying = video.paused;                 // remembered so a redraw resumes as-is
  if (spPlaying) {
    video.play().catch(() => {});
    if (spAudioEl) spAudioEl.play().catch(() => {});
  } else {
    video.pause();
    if (spAudioEl) spAudioEl.pause();
  }
  if (button) button.textContent = spPlaying ? "⏸ Jeda" : "▶ Putar";
}

function wireShortPicker() {
  const wrap = $("pickwrap"), box = $("pickbox"), img = $("pickimg");
  let start = null;
  const at = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const place = (a, b) => {
    box.style.display = "block";
    box.style.left = Math.min(a[0], b[0]) + "px";
    box.style.top = Math.min(a[1], b[1]) + "px";
    box.style.width = Math.abs(a[0] - b[0]) + "px";
    box.style.height = Math.abs(a[1] - b[1]) + "px";
  };
  // "Tambah teks" stays live without a fresh drag once a shared box exists;
  // "Pindahkan kotak" is the one that needs one.
  const syncButtons = () => {
    const spec = SHORT_LAYERS[shortLayer];
    const ok = $("pickok"), move = $("pickmove");
    if (ok) ok.disabled = !(pick || (spec.withText && spec.get(state).length));
    if (move) move.disabled = !pick;
  };
  wrap.onmousedown = (e) => { start = at(e); pick = null; syncButtons(); e.preventDefault(); };
  wrap.onmousemove = (e) => { if (start) place(start, at(e)); };
  window.onmouseup = (e) => {
    if (!start) return;
    const scale = SHORT_W / img.clientWidth;
    const end = at(e);
    const rect = [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
                  Math.abs(start[0] - end[0]), Math.abs(start[1] - end[1])];
    start = null;
    if (rect[2] < 12 || rect[3] < 12) { box.style.display = "none"; syncButtons(); return; }
    pick = rect.map((v) => Math.round(v * scale));
    syncButtons();
    $("pickmsg").textContent = `${pick[2]}×${pick[3]} px`;
  };
  if (img.complete) drawExistingShort(); else img.onload = drawExistingShort;
}

function drawExistingShort() {
  const img = $("pickimg"), host = $("pickexisting");
  if (!img || !host) return;
  const px = img.clientWidth / SHORT_W;
  const spec = SHORT_LAYERS[shortLayer];
  const items = spec.get(state);
  host.innerHTML = "";

  const place = (rect, label, remove) => {
    const box = document.createElement("div");
    box.className = "shortBox";
    box.style.cssText = `position:absolute;left:${rect[0] * px}px;top:${rect[1] * px}px;
      width:${rect[2] * px}px;height:${rect[3] * px}px;border:2px solid ${spec.colour};
      background:${spec.colour}2e;font-size:10px;color:#fff;padding:2px;box-sizing:border-box;
      overflow:hidden;cursor:move`;
    box.title = "Tarik kotak ini untuk menggeser posisinya";
    box.textContent = label;
    if (remove !== null) {
      const button = document.createElement("button");
      button.textContent = "x";
      button.title = "Hapus kotak ini";
      button.style.cssText = `position:absolute;top:-11px;right:-11px;width:20px;height:20px;
        padding:0;border-radius:50%;font-size:11px;line-height:1;cursor:pointer`;
      button.onclick = () => removeShortItem(remove);
      box.appendChild(button);
    }
    host.appendChild(box);
    wireShortBoxDrag(box, rect, px);
  };

  // Captions all sit in one shared box, so there is exactly one to draw however
  // many there are; per-caption controls live in the list below instead.
  if (spec.withText) {
    if (items[0]?.rect) place(items[0].rect, `${items.length} teks`, null);
    return;
  }
  items.forEach((rect, i) => place(rect, "", i));
}

// Drag a box that already exists to reposition it, rather than having to redraw
// it from scratch to nudge it a few pixels. The mousedown stops here so the
// wrap's own "draw a new box" handler never sees it -- otherwise every attempt to
// move a box would start drawing a replacement over the top of it.
function wireShortBoxDrag(box, rect, px) {
  box.onmousedown = (event) => {
    if (event.target.tagName === "BUTTON") return;
    event.stopPropagation();
    event.preventDefault();
    const from = [event.clientX, event.clientY];
    const spec = SHORT_LAYERS[shortLayer];
    let moved = null;

    const drag = (e) => {
      const x = Math.round(Math.min(Math.max(0, rect[0] + (e.clientX - from[0]) / px),
                                    SHORT_W - rect[2]));
      const y = Math.round(Math.min(Math.max(0, rect[1] + (e.clientY - from[1]) / px),
                                    SHORT_H - rect[3]));
      moved = [x, y, rect[2], rect[3]];
      box.style.left = `${x * px}px`;
      box.style.top = `${y * px}px`;
      const message = $("pickmsg");
      if (message) message.textContent = `${x}, ${y} px`;
      // the board is a live layer in the preview, so it can follow the drag
      // itself; captions are baked into a server-rendered PNG and can only catch
      // up once the move is saved
      const host = $("spBoards"), wrap = $("shortPreviewWrap");
      if (!spec.withText && host && wrap) {
        const scale = wrap.clientWidth / SHORT_W;
        host.style.left = `${x * scale}px`;
        host.style.top = `${y * scale}px`;
      }
    };

    const drop = async () => {
      window.removeEventListener("mousemove", drag);
      window.removeEventListener("mouseup", drop);
      if (!moved || (moved[0] === rect[0] && moved[1] === rect[1])) return;
      try {
        if (spec.withText) {
          await spec.save(spec.get(state).map((item) => ({ ...item, rect: moved })));
        } else {
          await spec.save([moved]);
        }
        refresh();
      } catch (e) { alert(e.message); }
    };

    window.addEventListener("mousemove", drag);
    window.addEventListener("mouseup", drop);
  };
}

async function addShortItem() {
  const spec = SHORT_LAYERS[shortLayer];
  try {
    if (spec.withText) {
      // every caption lives in the same box: the first one drawn. A fresh drag
      // moves that shared box, so the captions never drift apart on screen.
      const items = spec.get(state);
      const rect = pick || items[0]?.rect;
      if (!rect) { $("pickmsg").textContent = "Tarik dulu kotaknya di gambar sebelah kiri."; return; }
      const input = $("shorttext"), sizeInput = $("shorttextsize");
      const text = input?.value.trim();
      if (!text) { $("pickmsg").textContent = "Isi teksnya dulu di kolom sebelah."; return; }
      const scale = Math.min(2.5, Math.max(0.4, parseFloat(sizeInput?.value) || 1.0));
      const startInput = $("shorttextstart"), endInput = $("shorttextend");
      const start = Math.max(0, parseFloat(startInput?.value) || 0);
      const endRaw = (endInput?.value ?? "").trim();
      const end = endRaw === "" ? null : Math.max(0, parseFloat(endRaw) || 0);
      const kept = items.map((item) => ({ ...item, rect }));
      await spec.save([...kept, { text, rect, scale, start, end }]);
      input.value = ""; if (sizeInput) sizeInput.value = "1.0";
      if (startInput) startInput.value = "0";
      if (endInput) endInput.value = "";
    } else {
      if (!pick) return;
      await spec.save([pick]);
    }
    pick = null; refresh();
  } catch (e) { alert(e.message); }
}

// Move the shared caption box without adding anything to it.
async function moveShortTextBox() {
  if (!pick) return;
  const spec = SHORT_LAYERS.text;
  try {
    await spec.save(spec.get(state).map((item) => ({ ...item, rect: pick })));
    pick = null; refresh();
  } catch (e) { alert(e.message); }
}

// Every caption with its own on-screen window, editable in place. The boxes drawn
// over the frame stay the place to move and size a caption; timing needs numbers,
// and numbers need room the box doesn't have.
function shortTextTable(items) {
  const total = estimateShortDuration(shortOpts.plies, shortOpts.pad, shortOpts.tail);
  const rows = items.map((item, i) => {
    const start = Number(item.start) || 0;
    const end = item.end === null || item.end === undefined ? "" : Number(item.end);
    const late = start >= total ? ` <span class="tag guess">di luar durasi</span>` : "";
    return `<tr>
      <td style="color:var(--muted);width:18px">${i + 1}</td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${escape_(item.text)}">${escape_(item.text)}${late}</td>
      <td><input type="number" min="0" step="0.5" value="${start}" style="width:56px;padding:4px 5px"
                 title="Muncul dari detik ke-berapa"
                 onchange="setShortTextTime(${i}, 'start', this.value)"></td>
      <td><input type="number" min="0" step="0.5" value="${end}" placeholder="akhir"
                 style="width:56px;padding:4px 5px"
                 title="Hilang di detik ke-berapa. Kosongkan = sampai habis"
                 onchange="setShortTextTime(${i}, 'end', this.value)"></td>
      <td><input type="number" min="0.4" max="2.5" step="0.1" value="${(item.scale ?? 1.0).toFixed(1)}"
                 style="width:56px;padding:4px 5px"
                 title="Pengali ukuran teks -- 1.0 = pas otomatis di kotak"
                 onchange="setShortTextScale(${i}, this.value)"></td>
      <td><button onclick="removeShortText(${i})" title="Hapus caption ini"
                  style="padding:2px 8px;font-size:12px">x</button></td>
    </tr>`;
  }).join("");
  return `<table style="margin-top:11px;width:100%;font-size:12px">
    <tr class="hint"><td></td><td>teks</td><td>dari</td><td>sampai</td><td>ukuran</td><td></td></tr>
    ${rows}
  </table>
  <p class="hint" style="margin:6px 0 0">Semua caption memakai satu kotak yang sama; ukurannya
    diatur sendiri-sendiri di sini. Detik dihitung di video short-nya sendiri, bukan di video
    siaran. Total sekarang ${fmtTime(total)}.</p>`;
}

async function setShortTextTime(index, field, value) {
  const spec = SHORT_LAYERS.text;
  const parsed = String(value).trim() === "" ? null : Math.max(0, parseFloat(value) || 0);
  const items = spec.get(state).map((item, i) => i === index ? { ...item, [field]: parsed } : item);
  try {
    await spec.save(items);
    refresh();
  } catch (e) { alert(e.message); }
}

async function removeShortText(index) {
  const spec = SHORT_LAYERS.text;
  try {
    await spec.save(spec.get(state).filter((_, i) => i !== index));
    refresh();
  } catch (e) { alert(e.message); }
}

// Captions bucketed by the window they share -- mirrors core/render.py's
// short_text_groups() so the preview stacks exactly the layers the render will.
function shortTextGroups(texts) {
  const groups = new Map();
  (texts || []).forEach((item, index) => {
    const start = Math.max(0, Number(item.start) || 0);
    let end = (item.end === null || item.end === undefined || item.end === "")
      ? null : Number(item.end);
    if (end !== null && !(end > start)) end = null;
    const key = start + "|" + (end === null ? "" : end);
    if (!groups.has(key)) groups.set(key, { start, end, indices: [] });
    groups.get(key).indices.push(index);
  });
  return [...groups.values()];
}

async function setShortTextScale(index, value) {
  const spec = SHORT_LAYERS.text;
  const scale = Math.min(2.5, Math.max(0.4, parseFloat(value) || 1.0));
  const items = spec.get(state).map((item, i) => i === index ? { ...item, scale } : item);
  try {
    await spec.save(items);
    refresh();
  } catch (e) { alert(e.message); }
}

async function removeShortItem(index) {
  const spec = SHORT_LAYERS[shortLayer];
  await spec.save(spec.get(state).filter((_, i) => i !== index));
  refresh();
}

async function clearShortLayer() {
  await SHORT_LAYERS[shortLayer].save([]);
  refresh();
}

function pickFrameSrc(t) {
  const zoomed = picking === "layout" && layer !== "zoom";
  return `api/projects/${current}/frame?t=${t}&width=880${zoomed ? "&zoomed=1" : ""}`;
}

function wirePicker() {
  pickInfoHtml = "";
  const ghostImg = $("pickimg");
  if (ghostImg) { ghostImg.addEventListener("load", drawGhosts); if (ghostImg.complete) drawGhosts(); }
  wireScrubber("pick", $("pickimg"), { frameSrc: pickFrameSrc, onTime: (t) => { pickAt = t; },
                                       onLabel: renderPickInfo });
  renderPickInfo(+$("pickRange").value);
  if (picking === "thumb") return;
  if (picking === "board") wireQuadPicker();
  else if (layer === "zoom") wireZoomPicker();
  else wireRectPicker();
}

function wireZoomPicker() {
  const wrap = $("pickwrap"), img = $("pickimg"), box = $("zoombox");
  const zoom = { percent: 100, x: 0.5, y: 0.5, ...state.source_zoom };
  let dragging = false;
  const place = () => {
    const factor = zoom.percent / 100;
    const w = img.clientWidth / factor, h = img.clientHeight / factor;
    const left = Math.min(Math.max(zoom.x * img.clientWidth - w / 2, 0), img.clientWidth - w);
    const top = Math.min(Math.max(zoom.y * img.clientHeight - h / 2, 0), img.clientHeight - h);
    box.style.left = left + "px"; box.style.top = top + "px";
    box.style.width = w + "px"; box.style.height = h + "px";
  };
  const at = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const moveTo = (p) => {
    zoom.x = p[0] / img.clientWidth;
    zoom.y = p[1] / img.clientHeight;
    place();
  };
  wrap.onmousedown = (e) => { dragging = true; moveTo(at(e)); e.preventDefault(); };
  wrap.onmousemove = (e) => { if (dragging) moveTo(at(e)); };
  window.onmouseup = () => { if (dragging) { dragging = false; saveZoom(zoom); } };
  if (img.complete) place(); else img.onload = place;
}

async function saveZoom(zoom) {
  try {
    await post("source-zoom", { zoom: { percent: zoom.percent, x: zoom.x, y: zoom.y } });
    refresh();
  } catch (e) { alert(e.message); }
}

function setZoomPercent(value) {
  const zoom = { percent: 100, x: 0.5, y: 0.5, ...state.source_zoom };
  zoom.percent = Math.min(500, Math.max(100, Number(value) || 100));
  saveZoom(zoom);
}

async function resetZoom() {
  await post("source-zoom", { zoom: null });
  refresh();
}

// Move an already-drawn box by dragging it, instead of redrawing it to nudge it.
// `rect` is in frame units (W x H); `px` converts them to displayed pixels. The
// mousedown stops here so the wrap's own "draw a new box" handler never starts a
// replacement underneath. `onDrop(moved)` only fires when the box really moved.
function wireBoxDrag(box, initial, { W, H, px, onMove, onDrop }) {
  const rect = initial.slice();          // follows the box, so a second drag starts where the first ended
  box.style.pointerEvents = "auto";
  box.style.cursor = "move";
  box.title = "Tarik kotak ini untuk menggeser posisinya";
  box.onmousedown = (event) => {
    if (event.target.closest("button")) return;
    event.stopPropagation();
    event.preventDefault();
    const from = [event.clientX, event.clientY];
    let moved = null;
    const drag = (e) => {
      const x = Math.round(Math.min(Math.max(0, rect[0] + (e.clientX - from[0]) / px), W - rect[2]));
      const y = Math.round(Math.min(Math.max(0, rect[1] + (e.clientY - from[1]) / px), H - rect[3]));
      moved = [x, y, rect[2], rect[3]];
      box.style.left = `${x * px}px`;
      box.style.top = `${y * px}px`;
      const message = $("pickmsg");
      if (message) message.textContent = `posisi ${x}, ${y} px`;
      if (onMove) onMove(moved);
    };
    const drop = () => {
      window.removeEventListener("mousemove", drag);
      window.removeEventListener("mouseup", drop);
      if (!moved || (moved[0] === rect[0] && moved[1] === rect[1])) return;
      rect[0] = moved[0]; rect[1] = moved[1];
      onDrop(moved);
    };
    window.addEventListener("mousemove", drag);
    window.addEventListener("mouseup", drop);
  };
}

function wireRectPicker() {
  const wrap = $("pickwrap"), box = $("pickbox"), img = $("pickimg");
  const spec = LAYERS[layer];
  const fixedSize = spec.pairSize && !spec.get(state).length ? spec.pairSize(state) : null;
  let start = null;
  const at = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const place = (a, b) => {
    box.style.display = "block";
    box.style.left = Math.min(a[0], b[0]) + "px";
    box.style.top = Math.min(a[1], b[1]) + "px";
    box.style.width = Math.abs(a[0] - b[0]) + "px";
    box.style.height = Math.abs(a[1] - b[1]) + "px";
  };
  // Nameplates: once one side has a box, the other inherits its size and can only
  // be dragged into position -- no need to redraw the same rectangle from scratch.
  const placeFixed = (center) => {
    const toDisplay = img.clientWidth / state.width;
    const w = fixedSize[0] * toDisplay, h = fixedSize[1] * toDisplay;
    const left = Math.min(Math.max(center[0] - w / 2, 0), img.clientWidth - w);
    const top = Math.min(Math.max(center[1] - h / 2, 0), img.clientHeight - h);
    box.style.display = "block";
    box.style.left = left + "px"; box.style.top = top + "px";
    box.style.width = w + "px"; box.style.height = h + "px";
    return [left, top, w, h];
  };
  wrap.onmousedown = (e) => {
    start = at(e); pick = null; $("pickok").disabled = true;
    box.style.pointerEvents = "none";
    if (fixedSize) placeFixed(start);
    e.preventDefault();
  };
  wrap.onmousemove = (e) => {
    if (!start) return;
    if (fixedSize) placeFixed(at(e)); else place(start, at(e));
  };
  window.onmouseup = (e) => {
    if (!start) return;
    const scale = state.width / img.clientWidth;
    const rect = fixedSize ? placeFixed(at(e)) : (() => {
      const end = at(e);
      return [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
              Math.abs(start[0] - end[0]), Math.abs(start[1] - end[1])];
    })();
    start = null;
    if (rect[2] < 12 || rect[3] < 12) { box.style.display = "none"; return; }
    pick = rect.map((v) => Math.round(v * scale));
    $("pickok").disabled = false;
    $("pickmsg").textContent = `${pick[2]}×${pick[3]} px — tarik kotaknya untuk menggeser`;
    wireBoxDrag(box, pick, { W: state.width, H: state.height, px: 1 / scale,
                             onMove: (moved) => { pick = moved; }, onDrop: (moved) => { pick = moved; } });
  };
  if (img.complete) drawExistingRects();
  else img.onload = drawExistingRects;
}

function drawExistingRects() {
  const img = $("pickimg"), host = $("pickexisting");
  if (!img || !host) return;
  const scale = img.clientWidth / state.width;
  const spec = LAYERS[layer];
  const rects = spec.get(state);
  host.innerHTML = rects.map((r, i) => `
    <div data-i="${i}" style="position:absolute;left:${r[0] * scale}px;top:${r[1] * scale}px;
         width:${r[2] * scale}px;height:${r[3] * scale}px;border:2px solid ${spec.colour};
         background:${spec.colour}2e">
      <button onclick="removeRect(${i})" title="Hapus kotak ini"
         style="position:absolute;top:-11px;right:-11px;width:20px;height:20px;padding:0;
         border-radius:50%;font-size:11px;line-height:1;cursor:pointer">×</button>
    </div>`).join("");
  host.querySelectorAll("[data-i]").forEach((box) => {
    const i = +box.dataset.i;
    wireBoxDrag(box, rects[i], { W: state.width, H: state.height, px: scale,
      onDrop: async (moved) => {
        try { await spec.save(rects.map((r, j) => (j === i ? moved : r))); refresh(); }
        catch (e) { alert(e.message); }
      } });
  });
}

async function addRect() {
  if (!pick) return;
  const spec = LAYERS[layer];
  try {
    await spec.save(spec.multi ? [...spec.get(state), pick] : [pick]);
    pick = null; refresh();
  } catch (e) { alert(e.message); }
}

async function removeRect(index) {
  const spec = LAYERS[layer];
  await spec.save(spec.get(state).filter((_, i) => i !== index));
  refresh();
}

async function clearLayer() {
  await LAYERS[layer].save([]);
  refresh();
}

// Board corners: click 4 points to place, then drag any of them to follow the
// camera's angle on the board instead of forcing an axis-aligned box.
function wireQuadPicker() {
  const wrap = $("pickwrap"), img = $("pickimg");
  const toLocal = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  const nearestHandle = (p) => {
    let best = null, bestDist = 16;
    quadPoints.forEach((q, i) => {
      const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  };
  const init = () => {
    const scale = img.clientWidth / state.width;
    quadPoints = state.board_quad ? state.board_quad.map(([x, y]) => [x * scale, y * scale]) : [];
    quadDragIndex = null;
    renderQuad();
  };
  wrap.onclick = (e) => {
    if (quadPoints.length >= 4) return;
    quadPoints.push(toLocal(e));
    renderQuad();
  };
  wrap.onmousedown = (e) => {
    if (quadPoints.length < 4) return;
    const idx = nearestHandle(toLocal(e));
    if (idx !== null) { quadDragIndex = idx; e.preventDefault(); }
  };
  window.onmousemove = (e) => {
    if (quadDragIndex === null) return;
    quadPoints[quadDragIndex] = toLocal(e);
    renderQuad();
  };
  window.onmouseup = () => { quadDragIndex = null; };
  if (img.complete) init(); else img.onload = init;
}

function renderQuad() {
  const poly = $("pickpolygon"), host = $("pickhandles"), ok = $("quadok"), msg = $("pickmsg");
  if (!poly || !host) return;
  poly.setAttribute("points", quadPoints.map((p) => p.join(",")).join(" "));
  host.innerHTML = quadPoints.map((p) => `
    <div style="position:absolute;left:${p[0] - 6}px;top:${p[1] - 6}px;width:12px;height:12px;
         border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:grab"></div>`).join("");
  if (ok) ok.disabled = quadPoints.length !== 4;
  if (msg) msg.textContent = quadPoints.length < 4
    ? `${quadPoints.length}/4 titik` : "tarik titik untuk menyesuaikan";
}

function resetQuad() { quadPoints = []; renderQuad(); }

async function saveQuad() {
  if (quadPoints.length !== 4) return;
  const img = $("pickimg"), scale = state.width / img.clientWidth;
  const quad = quadPoints.map(([x, y]) => [Math.round(x * scale), Math.round(y * scale)]);
  await api(`api/projects/${current}/board-quad`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quad }),
  });
  refresh();
}

async function clearQuad() {
  await api(`api/projects/${current}/board-quad`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quad: null }),
  });
  quadPoints = []; refresh();
}

// A single ply is far too short to judge in blitz, so the player reviews a slice
// of timeline at a time and the board steps through every move inside it.
let segLen = 10, segStart = null;

function ensureVideo() {
  if (!videoEl) {
    videoEl = document.createElement("video");
    videoEl.muted = true; videoEl.playsInline = true; videoEl.preload = "auto";
    videoEl.autoplay = true; videoEl.controls = true;
    videoEl.style.cssText = "width:100%;border-radius:7px;display:block;background:#000";
  }
  const src = `api/projects/${current}/video`;
  if (videoEl.dataset.project !== current) {
    videoEl.dataset.project = current; videoEl.src = src;
  }
  return videoEl;
}

function timed() { return (state.waypoints || []).filter((w) => w.timestamp !== null); }
function inSegment(start) {
  return timed().filter((w) => w.timestamp >= start && w.timestamp < start + segLen);
}
function baselinePly(start) {
  const earlier = timed().filter((w) => w.timestamp < start);
  return earlier.length ? earlier[earlier.length - 1].ply : 0;
}

function showReview(ply) {                       // called from the ply table
  selected = ply;
  const w = state.waypoints.find((x) => x.ply === ply);
  if (!w || w.timestamp === null) return;
  showSegment(Math.max(0, Math.floor(w.timestamp / segLen) * segLen));
}

function stepSegment(delta) {
  showSegment(Math.max(0, (segStart ?? 0) + delta * segLen));
}

function setSegLen(value) {
  const anchor = selected !== null
    ? (state.waypoints.find((x) => x.ply === selected) || {}).timestamp ?? segStart : segStart;
  segLen = value;
  showSegment(Math.max(0, Math.floor((anchor ?? 0) / segLen) * segLen));
}

function showSegment(start) {
  segStart = start;
  const list = inSegment(start);
  const base = baselinePly(start);
  if (selected === null || !list.some((w) => w.ply === selected)) {
    selected = list.length ? list[0].ply : null;
  }
  document.querySelectorAll("tr.ply").forEach((tr) => tr.classList.toggle(
    "on", list.some((w) => String(w.ply) === tr.firstElementChild.textContent)));

  const boards = [base, ...list.map((w) => w.ply)].map((p, index) =>
    `<img class="rvBoard" data-ply="${p}"
       src="api/projects/${current}/board?ply=${p}&width=420&_=${lookStamp}"
       style="${index ? "position:absolute;inset:0;" : ""}opacity:${index ? 0 : 1}">`).join("");
  const marks = list.map((w) => `<div class="rvMark" data-ply="${w.ply}"
       style="position:absolute;top:0;bottom:0;width:2px;background:var(--warn);
       left:${((w.timestamp - start) / segLen) * 100}%"></div>`).join("");
  const chips = list.map((w) => {
    const flag = w.needs_review ? " ⚠" : "";
    return `<button class="chip" data-ply="${w.ply}" onclick="pickPly(${w.ply})"
      style="padding:4px 9px;font-size:12px">${w.move_number}${w.side === "white" ? "." : "…"}${escape_(w.san)}
      <span style="color:var(--muted)">${w.timestamp.toFixed(2)}${flag}</span></button>`;
  }).join("") || `<span class="hint">Tidak ada langkah di rentang ini.</span>`;

  $("review").innerHTML = `
    <div class="row" style="margin-bottom:8px;justify-content:space-between">
      <div class="row">
        <button onclick="stepSegment(-1)">←</button>
        <b>${start.toFixed(0)}–${(start + segLen).toFixed(0)}s</b>
        <button onclick="stepSegment(1)">→</button>
        <span class="hint">${list.length} langkah</span>
      </div>
      <div class="row">
        ${[10, 20, 30].map((v) => `<button onclick="setSegLen(${v})" id="seg${v}"
            style="padding:4px 8px;font-size:12px">${v}s</button>`).join("")}
      </div>
    </div>
    <div class="split">
      <figure style="margin:0" id="rvLeft"><figcaption>video sumber</figcaption></figure>
      <figure style="margin:0"><figcaption>papan hasil — <span id="rvNow">…</span></figcaption>
        <div style="position:relative">${boards}</div></figure>
    </div>
    <div style="position:relative;height:6px;border-radius:3px;background:#0f1114;
         margin:10px 0 9px">
      <div id="rvFill" style="position:absolute;inset:0 100% 0 0;background:#3d4654;
           border-radius:3px"></div>${marks}
    </div>
    <div class="row" style="margin-bottom:9px">${chips}</div>
    <div class="row">
      ${[-2, -1, -0.25, 0.25, 1, 2].map((d) =>
        `<button onclick="nudgeSelected(${d})">${d > 0 ? "+" : ""}${d}s</button>`).join("")}
      <span style="flex:1"></span>
      ${[0.25, 0.5, 1].map((r) =>
        `<button onclick="setRate(${r})" id="rate${String(r).replace(".", "")}"
           style="padding:4px 8px;font-size:12px">${r}×</button>`).join("")}
    </div>
    <p class="hint" style="margin-top:8px">Video berputar sepanjang rentang ini dan papan kanan
      ikut melangkah. Garis kuning = titik pergantian. Pilih langkah di atas lalu geser:
      pemain jalan duluan → kurangi; papan berganti duluan → tambah.</p>`;

  $("rvLeft").appendChild(ensureVideo());
  const active = $("seg" + segLen); if (active) active.style.borderColor = "var(--accent)";
  markChip();
  setRate(rate);
  startLoop();
}

function pickPly(ply) { selected = ply; markChip(); }

function markChip() {
  document.querySelectorAll(".chip").forEach((b) => {
    b.style.borderColor = Number(b.dataset.ply) === selected ? "var(--accent)" : "";
  });
}

function setRate(value) {
  rate = value;
  if (videoEl) videoEl.playbackRate = value;
  [0.25, 0.5, 1].forEach((r) => {
    const b = $("rate" + String(r).replace(".", ""));
    if (b) b.style.borderColor = r === value ? "var(--accent)" : "";
  });
}

function startLoop() {
  clearInterval(rafId);
  if (!videoEl || segStart === null) return;
  const rewind = () => {
    try { videoEl.currentTime = segStart; } catch {}
    videoEl.play().catch(() => {});
  };
  if (videoEl.readyState >= 1) rewind();
  else videoEl.addEventListener("loadedmetadata", rewind, { once: true });

  const tick = () => {
    if (!videoEl.isConnected) { clearInterval(rafId); return; }
    const now = videoEl.currentTime;
    // never re-seek while one is already in flight, or the loop never gets to play
    if (!videoEl.seeking && (now >= segStart + segLen || now < segStart - 0.5)) {
      videoEl.currentTime = segStart;
      videoEl.play().catch(() => {});
      return;
    }
    const list = inSegment(segStart);
    let shown = baselinePly(segStart), label = "sebelum langkah";
    for (const w of list) {
      if (now >= w.timestamp) {
        shown = w.ply;
        label = `${w.move_number}${w.side === "white" ? "." : "…"}${w.san}`;
      }
    }
    document.querySelectorAll(".rvBoard").forEach((img) => {
      img.style.opacity = Number(img.dataset.ply) === shown ? 1 : 0;
    });
    const now_ = $("rvNow"); if (now_) now_.textContent = label;
    const fill = $("rvFill");
    if (fill) fill.style.right = (100 - Math.min(100, Math.max(0,
      ((now - segStart) / segLen) * 100))) + "%";
  };
  rafId = setInterval(tick, 40);
  tick();
}

function nudgeSelected(delta) {
  if (selected === null) return;
  const w = state.waypoints.find((x) => x.ply === selected);
  if (!w || w.timestamp === null) return;
  w.timestamp = Math.max(0, Math.round((w.timestamp + delta) * 1000) / 1000);
  w.edited = true; w.source = "manual"; w.needs_review = false; dirty = true;

  // patch in place so the player keeps running
  const chip = document.querySelector(`.chip[data-ply="${w.ply}"] span`);
  if (chip) chip.textContent = w.timestamp.toFixed(2);
  const mark = document.querySelector(`.rvMark[data-ply="${w.ply}"]`);
  if (mark) mark.style.left = ((w.timestamp - segStart) / segLen) * 100 + "%";
  const row = [...document.querySelectorAll("tr.ply")].find(
    (tr) => tr.firstElementChild.textContent === String(w.ply));
  if (row) {
    row.children[2].textContent = fmt(w.timestamp);
    row.children[3].innerHTML = `<span class="tag edited">manual</span>`;
  }
  const save = [...document.querySelectorAll("button")].find(
    (b) => b.textContent === "Simpan perubahan");
  if (save) save.disabled = false;
}

async function save() {
  await api(`api/projects/${current}/waypoints`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ waypoints: state.waypoints.map((w) => ({ ply: w.ply, timestamp: w.timestamp })) }),
  });
  dirty = false; refresh();
}

function pollBusy() {
  refresh();
  clearInterval(timer);
  // poll only while work is running, otherwise a redraw would interrupt the review player
  timer = setInterval(async () => {
    await refresh();
    if (!state?.busy) clearInterval(timer);
  }, 1500);
}

async function run(what) {
  picking = false;
  await api(`api/projects/${current}/${what}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: what === "render" ? JSON.stringify({ full_video: true }) : "{}",
  });
  pollBusy();
}

// The long video only: board.mp4 + full-video.mp4. The short has its own button,
// so nothing here depends on the short's layout or its ply/jeda/ekor boxes.
async function runRender() {
  try {
    // save first: the endpoint renders the project's stored lead-in, so an edit left
    // unsaved in the box can never quietly render at the old start point
    await post("lead-in", { seconds: leadIn });
    await post("outro", { seconds: outro });
    await api(`api/projects/${current}/render`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_video: true }),
    });
    pollBusy();
  } catch (e) { alert(e.message); }
}

// The short only: the long video is never touched. board.mp4 is reused when an
// earlier render left one with the same look, so trying another plies/jeda/ekor
// combination costs seconds; the server rebuilds it by itself when it is missing or
// the look changed. Without a short layout the short is the bare centred default
// with no captions, so ask rather than quietly produce that.
async function runShort() {
  const { plies, pad, tail } = shortParams();
  if (!state.has_short_layout && !confirm(
      "Layout short belum diatur (posisi papan / teks caption belum ada).\n\n" +
      "OK  = tetap render pakai posisi papan default\n" +
      "Batal = buka panel layout short dulu")) {
    setStep(3);
    return;
  }
  try {
    // save first: the endpoint renders the project's stored cut, so an edit left
    // unsaved in the boxes can never quietly render at the old length
    await post("short-cut", { plies, pad, tail });
    await api(`api/projects/${current}/short`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    pollBusy();
  } catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------- thumbnail

// Rough cost of one paid edit at 1280x720, in USD, by quality. An ESTIMATE only:
// OpenAI publishes a per-token rate, not tokens-per-image, so these are derived
// from third-party per-image figures scaled to this canvas. The panel shows the
// real token counts from the API's own usage block once a call has been made --
// trust those, not this.
const THUMB_RATE = 16500;                 // rupiah per USD, for a readable hint
let thumbAt = 0, thumbPrompt = "", thumbPromptDirty = false;
let thumbHasKey = null, thumbStamp = 0, thumbQuality = "high";
let thumbModels = [], thumbModel = "";

function thumbModelRecord(id) { return thumbModels.find((m) => m.id === (id ?? thumbModel)); }

// The per-edit price OpenRouter quotes for this model at 1280x720. Flagged as
// approximate for token-billed models, where the count -- and so the price --
// swings with the quality setting. The real figure arrives in usage.cost.
function thumbCostHint(id) {
  const m = thumbModelRecord(id);
  if (!m || m.usd == null) return "harga tidak diketahui";
  const rp = Math.round(m.usd * THUMB_RATE).toLocaleString("id-ID");
  return `${m.exact ? "" : "≈ "}$${m.usd.toFixed(4)} · Rp ${rp}${m.exact ? "" : " (ikut kualitas)"}`;
}

// Every token the project has actually been billed for, summed across attempts.
// Reads whatever field names the API used rather than assuming a shape -- image
// models have changed these before.
function thumbSpent(s) {
  let usd = 0, calls = 0, unknown = 0;
  for (const entry of s.thumb_usage || []) {
    const cost = (entry.usage || {}).cost;
    if (typeof cost === "number") usd += cost; else unknown += 1;
    calls += 1;
  }
  return { usd, calls, unknown };
}

async function initThumb() {
  if (pickAt === null && state.thumb_time != null) pickAt = state.thumb_time;
  thumbQuality = state.thumb_quality || "high";
  thumbPrompt = state.thumb_prompt || "";
  thumbPromptDirty = false;
  if (thumbHasKey === null) {
    try { thumbHasKey = (await api("api/openrouter-key")).has_key; } catch (e) { thumbHasKey = false; }
  }
  thumbModel = state.thumb_model || thumbModel;
  if (!thumbModels.length) await loadThumbModels(false);
}

// retry sends the frame the user approved rather than re-reading the video.

  try {
    thumbAt = pickAt ?? thumbAt;

async function saveThumbPrompt(reset) {

    thumbPrompt = body.thumb_prompt;

// Fetching prices costs one request per model, so the server caches the list and
// only refetches when asked. "Segarkan" is how a newly released model shows up.
async function loadThumbModels(refresh) {
  try {
    const body = await api(`api/openrouter/models${refresh ? "?refresh=true" : ""}`);
    thumbModels = body.models || [];
    if (!thumbModelRecord(thumbModel)) thumbModel = body.default;
  } catch (e) { thumbModels = []; }

async function refreshThumbModels() {
  await loadThumbModels(true);

function setThumbModel(id) {
  thumbModel = id;
  const allowed = thumbModelRecord(id)?.qualities;
  if (allowed && !allowed.includes(thumbQuality)) thumbQuality = allowed.includes("high") ? "high" : allowed[0];
  draw();

async function saveOpenRouterKey() {
  const key = $("thumbKey").value.trim();
  if (!key) return;
  try {
    thumbHasKey = (await api("api/openrouter-key", {
      method: "POST", headers: { "Content-Type": "application/json" },

// The one paid step. Saves the prompt first for the same reason the render
// buttons save their settings first: what runs is what the box shows.
async function runThumbGenerate() {
  const model = thumbModel, allowed = thumbModelRecord()?.qualities;
  const quality = allowed ? thumbQuality : null;
  if (!confirm(`Kirim frame ini ke ${model}${quality ? ` (kualitas ${quality})` : ""}?\n\n`
      + `Perkiraan biaya: ${thumbCostHint()}\n`
      + `Biaya sebenarnya dilaporkan OpenRouter dan tampil di panel setelah selesai.`)) return;
  try {
    if (thumbPromptDirty) await post("thumb-prompt", { prompt: thumbPrompt });
    await post("thumb-generate", { quality, model });
    thumbPromptDirty = false;
    pollBusy();
  } catch (e) { alert(e.message); }

// Same drag-a-box interaction as the other pickers, in thumbnail pixels: the
// preview is 16:9 whether it is showing the 1920x1080 source frame or the
// 1280x720 result, so one scale factor is correct for both.
function wireThumbPicker() {
  const wrap = $("thumbwrap"), box = $("thumbbox"), img = $("thumbimg");
  if (!wrap || !img) return;
  const [W] = state.thumb_size || [1280, 720];
  let start = null;
  const at = (e) => {
    const b = img.getBoundingClientRect();
    return [Math.min(Math.max(e.clientX - b.left, 0), b.width),
            Math.min(Math.max(e.clientY - b.top, 0), b.height)];
  };
  wrap.onmousedown = (e) => { start = at(e); pick = null; e.preventDefault(); };
  wrap.onmousemove = (e) => {
    if (!start) return;
    const p = at(e);
    box.style.display = "block";
    box.style.left = Math.min(start[0], p[0]) + "px";
    box.style.top = Math.min(start[1], p[1]) + "px";
    box.style.width = Math.abs(start[0] - p[0]) + "px";
    box.style.height = Math.abs(start[1] - p[1]) + "px";
  };
  window.onmouseup = (e) => {
    if (!start) return;
    const end = at(e), scale = W / img.clientWidth;
    const rect = [Math.min(start[0], end[0]), Math.min(start[1], end[1]),
                  Math.abs(start[0] - end[0]), Math.abs(start[1] - end[1])];
    start = null;
    if (rect[2] < 12 || rect[3] < 12) { box.style.display = "none"; return; }
    pick = rect.map((v) => Math.round(v * scale));
    $("thumbmsg").textContent = `${pick[2]}×${pick[3]} px — isi teksnya lalu Tambah`;
  };
  if (img.complete) drawExistingThumb(); else img.onload = drawExistingThumb;
}

function drawExistingThumb() {
  const img = $("thumbimg"), host = $("thumbexisting");
  if (!img || !host) return;
  const [W, H] = state.thumb_size || [1280, 720];
  const px = img.clientWidth / W;
  host.innerHTML = "";
  (state.thumb_texts || []).forEach((item, index) => {
    const [x, y, w, h] = item.rect;
    const div = document.createElement("div");
    div.style.cssText = `position:absolute;left:${x * px}px;top:${y * px}px;width:${w * px}px;
      height:${h * px}px;border:1px dashed #ff1417aa`;
    host.appendChild(div);
    wireBoxDrag(div, item.rect, { W, H, px, onDrop: (moved) => saveThumbTexts(
      state.thumb_texts.map((t, j) => (j === index ? { ...t, rect: moved } : t))) });
  });
}

// ------------------------------------------------------------------ upload package
// Manual upload: the Cloud project is unaudited, so an API upload would land locked
// private. This card prepares everything to paste into YouTube Studio / the app for
// the chosen channel -- title, description, tags -- next to the files to download.
let uploadOpen = false, uploadTemplates = null, uploadChannel = "pawn-initiate",
    uploadFile = null, uploadForm = null, uploadFormKey = null, uploadDirty = false;
const UPLOAD_LIMITS = { title: 100, description: 5000, tags: 500 };

async function toggleUpload() {
  uploadOpen = !uploadOpen;
  if (uploadOpen && !uploadTemplates) {
    try { uploadTemplates = (await api("api/upload-templates")).channels; }
    catch (e) { alert(e.message); uploadOpen = false; }
  }
  draw();
  if (uploadOpen) $("uploadCard")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function uploadFiles(s) {
  return ["full-video.mp4", "short.mp4"].filter((f) => (s.outputs || []).includes(f));
}

// The draft saved for this channel + file, else the project name + channel defaults.
function loadUploadForm(s) {
  const files = uploadFiles(s);
  if (!files.includes(uploadFile)) uploadFile = files[0] || null;
  const key = `${uploadChannel}:${uploadFile}`;
  if (uploadFormKey === key && uploadForm) return;
  const draft = (s.upload_drafts || {})[key];
  const template = uploadTemplates?.[uploadChannel] || { description: "", tags: [] };
  uploadForm = draft
    ? { title: draft.title, description: draft.description, tags: draft.tags.join(", ") }
    : { title: s.name || "", description: template.description, tags: template.tags.join(", ") };
  uploadFormKey = key; uploadDirty = false;
}

function tagList(text) { return text.split(",").map((t) => t.trim()).filter(Boolean); }
// YouTube's own count: a tag containing a space is stored quoted (+2), plus commas.
function tagsLength(text) {
  const tags = tagList(text);
  return tags.reduce((n, t) => n + t.length + (t.includes(" ") ? 2 : 0), 0) + Math.max(0, tags.length - 1);
}
function uploadCount(field) {
  const value = uploadForm[field];
  const used = field === "tags" ? tagsLength(value) : [...value].length;
  const limit = UPLOAD_LIMITS[field];
  return `<span class="${used > limit ? "err" : "hint"}">${used}/${limit}</span>`;
}

function uploadCard(s) {
  loadUploadForm(s);
  const files = uploadFiles(s);
  const safeName = (s.name || current).replace(/[\\/:*?"<>|]+/g, " ").trim();
  const chip = (on, label, onclick) => `<button onclick="${onclick}" style="padding:5px 12px;${on
    ? "border-color:var(--accent);color:var(--accent)" : ""}">${label}</button>`;
  return `<div class="card" id="uploadCard">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b style="font-size:15px">Paket upload YouTube</b>
    </div>
    <p class="hint" style="margin:0 0 10px">Unggah manual lewat YouTube Studio / app: unduh
      filenya, lalu salin judul, deskripsi, dan tag di bawah. (Upload otomatis lewat API
      belum dipakai — sebelum app lolos audit YouTube, hasilnya terkunci private.)</p>
    <div class="row" style="margin-bottom:8px;gap:6px"><span class="hint">Channel:</span>
      ${Object.entries(uploadTemplates || {}).map(([slug, c]) =>
        chip(slug === uploadChannel, escape_(c.name), `setUploadChannel('${slug}')`)).join("")}</div>
    <div class="row" style="margin-bottom:12px;gap:6px"><span class="hint">File:</span>
      ${files.map((f) => chip(f === uploadFile, f === "short.mp4" ? "Short" : "Video panjang",
        `setUploadFile('${f}')`)).join("")}</div>

    <div class="row" style="justify-content:space-between"><label style="margin:0">Judul</label>
      <span class="row" style="gap:8px"><span id="upCount-title">${uploadCount("title")}</span>
      <button onclick="copyUpload('title', this)" style="padding:3px 10px;font-size:12px">Salin</button></span></div>
    <input id="up-title" value="${escape_(uploadForm.title)}" oninput="onUploadInput('title', this.value)"
           style="margin:5px 0 8px">
    ${titleSuggestBox(s)}

    <div class="row" style="justify-content:space-between"><label style="margin:0">Deskripsi</label>
      <span class="row" style="gap:8px"><span id="upCount-description">${uploadCount("description")}</span>
      <button onclick="copyUpload('description', this)" style="padding:3px 10px;font-size:12px">Salin</button></span></div>
    <textarea id="up-description" rows="10" oninput="onUploadInput('description', this.value)"
              style="margin:5px 0 12px;font:13px/1.5 system-ui,sans-serif">${escape_(uploadForm.description)}</textarea>

    <div class="row" style="justify-content:space-between"><label style="margin:0">Tag (pisahkan dengan koma)</label>
      <span class="row" style="gap:8px"><span id="upCount-tags">${uploadCount("tags")}</span>
      <button onclick="copyUpload('tags', this)" style="padding:3px 10px;font-size:12px">Salin</button></span></div>
    <textarea id="up-tags" rows="3" oninput="onUploadInput('tags', this.value)"
              style="margin:5px 0 12px;font:13px/1.5 system-ui,sans-serif;min-height:70px">${escape_(uploadForm.tags)}</textarea>

    <div class="row" style="gap:8px">
      <button id="upSave" ${uploadDirty ? 'class="primary"' : "disabled"} onclick="saveUploadDraft()">
        ${uploadDirty ? "Simpan draf" : "Draf tersimpan"}</button>
      <button onclick="saveUploadTemplate(this)"
              title="Deskripsi & tag ini jadi isi awal untuk proyek lain di channel yang sama">
        Jadikan default channel</button>
    </div>
    <div class="row" style="gap:8px;margin-top:12px">
      ${uploadFile ? `<a class="btnlink primary" href="api/projects/${current}/file/${uploadFile}"
          download="${escape_(safeName)}${uploadFile === "short.mp4" ? " (short)" : ""}.mp4">Unduh video</a>` : ""}
      ${s.has_thumbnail && uploadFile !== "short.mp4" ? `<a class="btnlink" href="api/projects/${current}/file/thumbnail.png"
          download="${escape_(safeName)}.png">Unduh thumbnail</a>` : ""}
      <a class="btnlink" href="https://studio.youtube.com" target="_blank" rel="noopener">Buka YouTube Studio ↗</a>
    </div>
    <p class="hint" style="margin:8px 0 0">Di Studio, pastikan channel yang aktif
      <b>${escape_(uploadTemplates?.[uploadChannel]?.name || "")}</b> (ganti lewat foto profil →
      Ganti akun) sebelum mengunggah.</p>
  </div>`;
}

// Five titles from Claude Code (core/titles.py): source title + PGN + the channel's
// measured patterns. Only channels with a pattern file in title-patterns/ get it.
const TITLE_PATTERN_CHANNELS = ["pawn-initiate"];
let titleBusy = false, titleError = "";

function titleSuggestBox(s) {
  const kind = uploadFile === "short.mp4" ? "short" : "long";
  const stored = (s.title_suggestions || {})[`${uploadChannel}:${kind}`];
  if (!TITLE_PATTERN_CHANNELS.includes(uploadChannel)) return `<p class="hint" style="margin:0 0 12px">
    Saran judul otomatis baru tersedia untuk Pawn Initiate (pola channel ini belum dipelajari).</p>`;
  return `<div class="suggest">
    <div class="row" style="gap:8px">
      <button id="titleSuggestBtn" ${titleBusy ? "disabled" : ""} onclick="suggestTitles()">
        ${titleBusy ? "Claude sedang menulis… (±20 dtk)" : stored ? "Buat 5 saran baru" : "Saran judul (Claude)"}</button>
      <span class="hint">dari judul sumber + PGN + pola judul ${escape_(uploadTemplates?.[uploadChannel]?.name || "")}
        ${kind === "short" ? "(Shorts)" : "(video panjang)"}</span>
    </div>
    ${titleError ? `<p class="err" style="margin:6px 0 0">${escape_(titleError)}</p>` : ""}
    ${stored ? `<ol class="suggest-list">${stored.titles.map((t, i) => `
      <li><button class="ghost" onclick="useSuggestedTitle(${i})" title="Pakai judul ini">
        <span class="t">${escape_(t.title)}</span><span class="num len">${[...t.title].length}</span>
        <span class="a">${escape_(t.angle)}</span></button></li>`).join("")}</ol>
      <p class="hint" style="margin:4px 0 0">Klik untuk memakai · dibuat ${escape_(stored.created)}</p>` : ""}
  </div>`;
}

async function suggestTitles() {
  titleBusy = true; titleError = ""; draw();
  try {
    const result = await post("title-suggestions", {
      kind: uploadFile === "short.mp4" ? "short" : "long", channel: uploadChannel });
    titleBusy = false;
    await refresh();                   // the suggestions are stored on the project
    return result;
  } catch (e) { titleBusy = false; titleError = e.message; draw(); }
}

function useSuggestedTitle(index) {
  const kind = uploadFile === "short.mp4" ? "short" : "long";
  const title = state.title_suggestions[`${uploadChannel}:${kind}`].titles[index].title;
  $("up-title").value = title;
  onUploadInput("title", title);
}

async function switchUpload(apply) {
  if (uploadDirty) await saveUploadDraft(true);     // never lose typed text on a switch
  apply(); uploadFormKey = null; draw();
}
function setUploadChannel(slug) { switchUpload(() => { uploadChannel = slug; }); }
function setUploadFile(file) { switchUpload(() => { uploadFile = file; }); }

function onUploadInput(field, value) {
  uploadForm[field] = value; uploadDirty = true;
  const count = $(`upCount-${field}`); if (count) count.innerHTML = uploadCount(field);
  const button = $("upSave");
  if (button) { button.disabled = false; button.className = "primary"; button.textContent = "Simpan draf"; }
}

async function saveUploadDraft(quiet) {
  try {
    await post("upload-draft", { channel: uploadChannel, file: uploadFile, title: uploadForm.title,
                                 description: uploadForm.description, tags: tagList(uploadForm.tags) });
    uploadDirty = false;
    state.upload_drafts = { ...(state.upload_drafts || {}), [`${uploadChannel}:${uploadFile}`]: {
      title: uploadForm.title, description: uploadForm.description, tags: tagList(uploadForm.tags) } };
    if (!quiet) draw();
  } catch (e) { alert(e.message); }
}

async function saveUploadTemplate(button) {
  const name = uploadTemplates[uploadChannel].name;
  if (!confirm(`Jadikan deskripsi & tag ini isi awal untuk semua proyek baru di ${name}?`)) return;
  try {
    const body = { description: uploadForm.description, tags: tagList(uploadForm.tags) };
    await api(`api/upload-templates/${uploadChannel}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    uploadTemplates[uploadChannel] = { ...uploadTemplates[uploadChannel], ...body };
    button.textContent = "Default tersimpan ✓";
  } catch (e) { alert(e.message); }
}

async function copyUpload(field, button) {
  const text = field === "tags" ? tagList(uploadForm.tags).join(", ") : uploadForm[field];
  try { await navigator.clipboard.writeText(text); }
  catch (e) {                                   // older browsers / non-secure context
    const box = $(`up-${field}`); box.select(); document.execCommand("copy");
  }
  const old = button.textContent;
  button.textContent = "Tersalin ✓";
  setTimeout(() => { button.textContent = old; }, 1500);
}

// Touch -> mouse bridge for every box picker (all of them are .pickarea and
// were written against mouse events). A finger that moves straight away is a page
// scroll and is left alone; holding still for HOLD_MS starts a drag, which is
// replayed as mousedown/mousemove/mouseup at the finger -- the same sequence a
// held left button produces. A quick tap becomes a click (quad corner placement).
// Moves and the release go to whatever is under the finger, as a real mouse's do.
(() => {
  const HOLD_MS = 280, SLOP = 8;
  let origin = null, start = null, timer = null, dragging = false;
  const fire = (type, el, t) => el.dispatchEvent(new MouseEvent(type, {
    bubbles: true, cancelable: true, view: window, button: 0,
    buttons: type === "mousedown" || type === "mousemove" ? 1 : 0,
    clientX: t.clientX, clientY: t.clientY }));
  const under = (t) => document.elementFromPoint(t.clientX, t.clientY) || document.body;
  const reset = () => { clearTimeout(timer); origin = null; dragging = false; };
  document.addEventListener("touchstart", (e) => {
    const el = e.target.closest && e.target;
    if (!el || !el.closest(".pickarea") || el.closest("button, input") || e.touches.length > 1) {
      reset(); return;
    }
    origin = el; start = e.touches[0]; dragging = false;
    const t = { clientX: start.clientX, clientY: start.clientY };
    timer = setTimeout(() => {
      dragging = true;
      if (navigator.vibrate) navigator.vibrate(12);
      fire("mousedown", origin, t);
    }, HOLD_MS);
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!origin) return;
    const t = e.touches[0];
    if (!dragging) {
      if (Math.hypot(t.clientX - start.clientX, t.clientY - start.clientY) > SLOP) reset();
      return;
    }
    e.preventDefault();                 // we own this gesture now: no scrolling
    fire("mousemove", under(t), t);
  }, { passive: false });
  const end = (e) => {
    if (!origin) return;
    const t = e.changedTouches[0], el = origin, wasDrag = dragging;
    reset();
    if (e.type === "touchcancel") { if (wasDrag) fire("mouseup", document.body, t); return; }
    e.preventDefault();                 // stop the browser's own emulated mouse events
    if (wasDrag) fire("mouseup", under(t), t);
    else fire("click", el, t);
  };
  document.addEventListener("touchend", end, { passive: false });
  document.addEventListener("touchcancel", end);
  // Long-press on an image would otherwise open the save/share menu.
  document.addEventListener("contextmenu", (e) => {
    if (e.target.closest && e.target.closest(".pickarea")) e.preventDefault();
  });
})();

loadList().then(() => showNew());
</script>
