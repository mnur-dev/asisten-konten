<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisten Konten — Catur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* One deliberate dark look (it sits next to broadcast footage all day): slate with
     a green bias, and the board-green accent the app always had. Status colours are
     separate from the accent. */
  :root {
    color-scheme: dark;
    --bg: #101315; --panel: #171b1e; --panel-2: #1e2326; --field: #0c0f11;
    --line: #2a3135; --line-strong: #3a4348;
    --ink: #e6eae4; --muted: #8d988f; --faint: #5f6a63;
    --accent: #86b86b; --accent-ink: #0e1c09; --accent-soft: #86b86b1f;
    --info: #6fa8d4; --warn: #d9a441; --bad: #e0695e;
    --radius: 8px;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .appbar { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex;
            align-items: center; gap: 12px; background: var(--bg); flex: none; }
  .appbar h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  .appbar h1 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px;
                     padding: 1px 7px; border: 1px solid var(--line); border-radius: 99px; }
  #drawerToggle { display: none; margin-left: auto; }
  main { display: grid; grid-template-columns: 250px 1fr; flex: 1; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px;
          display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
  section { overflow-y: auto; padding: 20px 26px 40px; }
  #panel > * { max-width: 1180px; }
  button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
           padding: 7px 13px; border-radius: 6px; cursor: pointer; font: inherit;
           font-weight: 500; transition: border-color .12s, background .12s; }
  button:hover:not(:disabled) { border-color: var(--line-strong); background: #242a2e; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
                   font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #97c87c; border-color: #97c87c; }
  button.ghost { background: transparent; }
  button.danger { background: transparent; color: var(--bad); border-color: transparent; }
  .proj-head > button.danger { white-space: nowrap; flex: none; padding: 6px 10px; font-size: 13px; }
  button.danger:hover:not(:disabled) { border-color: #e0695e55; background: #e0695e14; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea, select { width: 100%; background: var(--field); color: var(--ink);
                    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
                    font: inherit; }
  input:focus, textarea:focus, select:focus { border-color: var(--line-strong); outline: none; }
  input[type=number] { font-family: var(--mono); font-size: 13px; }
  input[type=range] { accent-color: var(--accent); background: none; border: 0; }
  textarea { font-family: var(--mono); font-size: 12px; min-height: 130px; resize: vertical; }
  label { display: block; margin: 12px 0 5px; color: var(--muted); font-size: 12px; }
  code { font-family: var(--mono); font-size: .92em; }

  /* project list */
  .proj { padding: 9px 10px; border-radius: 6px; cursor: pointer; display: grid;
          grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; }
  .proj:hover { background: var(--panel); }
  .proj.on { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .proj b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .pill { grid-column: 1; justify-self: start; }
  .proj button { grid-row: 1 / span 2; grid-column: 2; padding: 2px 8px; font-size: 12px;
                 color: var(--faint); background: transparent; border-color: transparent; }
  .proj button:hover:not(:disabled) { color: var(--bad); }
  .list-foot { margin-top: auto; padding-top: 8px; }

  /* status pill: state in form, not only in words */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
          padding: 2px 9px 2px 8px; border-radius: 99px; border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; letter-spacing: .01em; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--accent); border-color: #86b86b44; background: var(--accent-soft); }
  .pill.run { color: var(--info); border-color: #6fa8d444; background: #6fa8d414; }
  .pill.run::before { animation: pulse 1.2s ease-in-out infinite; }
  .pill.bad { color: var(--bad); border-color: #e0695e44; background: #e0695e14; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pill.run::before { animation: none; } }

  /* project head + workflow */
  .proj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
               margin-bottom: 14px; }
  .proj-head h2 { margin: 0; font-size: 20px; font-weight: 700; text-wrap: balance; line-height: 1.25; }
  .proj-head .meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; display: flex;
                     flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .92em; }
  .notice { border: 1px solid #e0695e55; background: #e0695e12; color: #f0a39b; border-radius: var(--radius);
            padding: 9px 12px; margin: 0 0 14px; font-size: 13px; }
  .progress { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px;
          background: var(--line); border: 1px solid var(--line); border-radius: var(--radius);
          overflow: hidden; margin-bottom: 16px; }
  @media (min-width: 1200px) {        /* the short step carries the most controls */
    .flow { grid-template-columns: 1fr .85fr 1fr 1.5fr .9fr; }
  }
  .step { background: var(--panel); padding: 13px 14px 14px; display: flex; flex-direction: column;
          gap: 9px; min-width: 0; }
  .step-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
                color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .step-label i { font-style: normal; font-family: var(--mono); color: var(--faint); letter-spacing: 0; }
  .step .row { gap: 7px; }
  .step-note { margin: 0; color: var(--faint); font-size: 12px; }
  .field { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
  .field input { width: 58px; padding: 5px 6px; }
  a.file { font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none;
           padding: 3px 8px; border: 1px solid #86b86b33; border-radius: 5px; background: var(--accent-soft); }
  a.file:hover { border-color: #86b86b88; }
  a.file.quiet { color: var(--muted); border-color: var(--line); background: transparent; }
  .stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
  .stepper button { display: flex; align-items: center; gap: 9px; padding: 9px 11px; text-align: left;
                    background: var(--panel); min-width: 0; }
  .stepper .n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                border: 1px solid var(--line-strong); font: 500 12px var(--mono); color: var(--muted); }
  .stepper .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stepper button.done .n { color: var(--accent); border-color: #86b86b66; }
  .stepper button.on { border-color: var(--accent); background: var(--accent-soft); }
  .stepper button.on .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step-head { margin-bottom: 12px; }
  .step-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .step-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 68ch; }
  .step-foot { display: flex; justify-content: space-between; gap: 10px; margin: 4px 0 18px; }
  .render-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .render-item { border: 1px solid var(--line); border-radius: 7px; padding: 12px; display: flex;
                 flex-direction: column; gap: 9px; background: var(--panel-2); }
  .suggest { margin: 0 0 14px; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: 7px; }
  .suggest-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .suggest-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto;
                         gap: 2px 10px; padding: 8px 10px; border-color: var(--line); }
  .suggest-list button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .suggest-list .t { font-weight: 600; }
  .suggest-list .len { color: var(--faint); align-self: start; }
  .suggest-list .a { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-weight: 400; }
  details.log { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
                margin-bottom: 15px; }
  details.log summary { cursor: pointer; padding: 10px 14px; color: var(--muted); font-size: 12px;
                        font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  details.log pre { margin: 0 12px 12px; max-height: 260px; }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px; margin-bottom: 16px; }
  pre { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        font: 11.5px/1.55 var(--mono); max-height: 190px; overflow: auto; margin: 0; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       padding: 5px 8px; position: sticky; top: 0; background: var(--panel); }
  td { padding: 4px 8px; border-top: 1px solid var(--line); }
  tr.ply { cursor: pointer; }
  tr.ply:hover td { background: #232830; }
  tr.ply.on td { background: #2c3340; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
  .ok { color: var(--accent); border-color: #34502c; }
  .guess { color: var(--warn); border-color: #5b4820; }
  .edited { color: #6fa8d4; border-color: #274157; }
  /* Move grades, in the same colours core/render.py paints on the board. Kept as
     text on a tinted chip rather than a filled circle: at 11px a circle turns into
     an unreadable dot, and the table already has enough colour in it. */
  .grade { font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
           border: 1px solid currentColor; opacity: .95; }
  .grade-brilliant { color: #26c2a3; }
  .grade-great { color: #7aaad4; }
  .grade-best { color: #96bc4b; }
  .grade-excellent, .grade-good { color: var(--muted); border-color: var(--line); }
  .grade-inaccuracy { color: #f7c631; }
  .grade-mistake { color: #ffa459; }
  .grade-blunder { color: #fa412d; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .split img { width: 100%; border-radius: 7px; display: block; background: #0f1114; }
  /* The short preview stacks transparent layers (caption PNG, board art) over the
     video, so they must NOT pick up .split img's opaque fill -- that turns the top
     layer into a solid rectangle hiding everything underneath it. */
  #shortPreviewWrap img, #shortPreviewWrap video { background: transparent; border-radius: 0; }
  .split figcaption { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
  .scroll { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
  .err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; }
  .scrub-row { max-width: 880px; }
  a.btnlink { display: inline-block; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
             padding: 7px 13px; border-radius: 6px; text-decoration: none; }
  a.btnlink.primary { background: var(--accent); border-color: var(--accent); color: #10210c; font-weight: 600; }
  .pickarea, .pickarea img { -webkit-touch-callout: none; -webkit-user-select: none; }
  .touch-only { display: none; }
  @media (hover: none) and (pointer: coarse) { .touch-only { display: block; } }
  /* Phones: the two fixed-height scroll panes become one normal page, the
     project list sits on top (capped so it doesn't push the panel off-screen),
     and every side-by-side .split stacks. */
  @media (max-width: 760px) {
    html, body { height: auto; min-height: 100%; }
    body { font-size: 15px; }
    .appbar { padding: 10px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
    #drawerToggle { display: inline-flex; }
    main { display: block; }
    /* the project list is a drawer on phones: it used to eat the first screen */
    aside { display: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    body.drawer-open aside { display: flex; }
    section { overflow: visible; padding: 16px 16px 40px; }
    .proj-head h2 { font-size: 18px; }
    .flow { grid-template-columns: 1fr; }
    .stepper { gap: 4px; }
    .stepper button { flex-direction: column; align-items: center; text-align: center; gap: 4px;
                      padding: 8px 2px; min-height: 0; }
    .stepper .lbl { font-size: 10.5px; white-space: normal; line-height: 1.2; }
    .card { padding: 12px; }
    .split { grid-template-columns: 1fr; }
    .split > * { min-width: 0; }  /* grid items default to min-content width */
    select { max-width: 100%; min-width: 0 !important; }
    .scroll { max-height: 300px; overflow-x: auto; }
    button { min-height: 36px; }
    input, textarea { font-size: 16px; }  /* < 16px makes iOS zoom in on focus */
    input[type=number] { width: 64px !important; }
    .look-img { width: 100% !important; max-width: 280px; }
    .look-opts { flex-basis: 100% !important; }
  }
</style>
</head>
<body>
<header class="appbar">
  <h1>Asisten Konten<small>Catur</small></h1>
  <button id="drawerToggle" class="ghost" onclick="toggleDrawer()" aria-controls="drawer">Proyek</button>
</header>
<main>
  <aside id="drawer">
    <button class="primary" style="width:100%" onclick="showNew()">+ Proyek baru</button>
    <div id="list"></div>
  </aside>
  <section id="panel"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null, state = null, selected = null, timer = null, dirty = false;
let picking = false, pick = null, pickAt = null;
let quadPoints = [], quadDragIndex = null;
let videoEl = null, rafId = null, rate = 0.5, lookStamp = 0;
let musicList = [];
// The preview <video> lives in the card's own markup, so every redraw hands us a
// brand new element -- these carry playback across that so editing a box mid-play
// doesn't restart the clip. (An earlier version kept one detached element and
// re-parented it on each redraw; Chrome stalls a media element moved that way,
// which left the preview showing everything except the video.)
let spAudioEl = null, spRafId = null, spWindowsKey = null, spLoopActive = false;
let spTime = null, spPlaying = false;
// Windows/index live out here so the scrub bar can move the playhead between
// jump-cut windows without reaching into the loop's closure.
let spWindows = [], spIdx = 0, spScrubbing = false, spFramePlies = null, spOptsTimer = null;
let spTextKey = null, spPopEl = null, spLastElapsed = -1;
// The short's cut, as edited on screen. It lives here rather than in the inputs
// themselves because draw() rebuilds the whole panel (every save, every poll tick),
// and values read straight off the DOM snapped back to their defaults, quietly
// putting the preview back to 20 plies. The saved copy lives on the project --
// this is the draft, seeded from it whenever a project is opened.
let shortOpts = { plies: 20, pad: 1, tail: 0 }, shortOptsFor = null;
// Seconds of broadcast kept before the first move in the long video. 0 = open on
// move 1. Held here while typing; pushed to the project right before a render.
let leadIn = 0, outro = 60;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
  return response.status === 204 ? null : response.json();
}

async function loadList() {
  const { projects } = await api("api/projects");
  $("list").innerHTML = projects.map((p) => `
    <div class="proj ${p.id === current ? "on" : ""}" onclick="open_('${p.id}')">
      <b>${escape_(p.name || p.id)}</b>
      <span class="pill ${p.status === "failed" ? "bad" : p.status === "done" ? "ok" : ""}">${STATUS_TEXT[p.status] || p.status}</span>
      <button title="Hapus proyek" aria-label="Hapus proyek ${escape_(p.name || p.id)}"
        onclick="event.stopPropagation();deleteProject('${p.id}','${escape_(p.name || p.id).replace(/'/g, "\\'")}')">×</button></div>`).join("")
    || `<p class="hint">Belum ada proyek.</p>`;
  $("drawerToggle").textContent = `Proyek (${projects.length})`;
  // Wiping everything is permanent, so the button only exists when there is
  // something to wipe -- and it asks twice.
  if (projects.length) $("list").insertAdjacentHTML("beforeend",
    `<div class="list-foot"><button class="danger" onclick="deleteAllProjects(${projects.length})"
       style="width:100%;font-size:12px">Hapus semua proyek</button></div>`);
}

async function deleteAllProjects(count) {
  if (!confirm(`Hapus SEMUA ${count} proyek? Semua video dan datanya akan hilang permanen.`)) return;
  if (!confirm("Yakin? Tindakan ini tidak bisa dibatalkan.")) return;
  try {
    const { deleted, busy } = await api("api/projects", { method: "DELETE" });
    current = null; selected = null; clearInterval(timer); clearInterval(rafId);
    $("panel").innerHTML = "";
    await loadList();
    if (busy.length) alert(`${deleted} proyek dihapus. Masih sibuk, dilewati: ${busy.join(", ")}`);
  } catch (e) { alert(e.message); }
}

async function deleteProject(id, name) {
  if (!confirm(`Hapus proyek "${name}"? Semua video dan datanya akan hilang permanen.`)) return;
  try {
    await api(`api/projects/${id}`, { method: "DELETE" });
    if (id === current) {
      current = null; selected = null; clearInterval(timer); clearInterval(rafId);
      $("panel").innerHTML = "";
    }
    await loadList();
  } catch (e) { alert(e.message); }
}

function escape_(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(t) { return t === null || t === undefined ? "—" : Number(t).toFixed(2) + "s"; }

function showNew() {
  toggleDrawer(false);
  current = null; selected = null; clearInterval(timer); loadList();
  $("panel").innerHTML = `
    <div class="card" style="max-width:720px">
      <h2 style="margin:0 0 4px;font-size:15px">Proyek baru</h2>
      <p class="hint">Tempel link video (YouTube, dll) dan PGN pertandingannya. Videonya diunduh otomatis.</p>
      <label>Link video</label>
      <input id="vp" placeholder="https://www.youtube.com/watch?v=...">
      <label>Nama (opsional)</label>
      <input id="nm" placeholder="Carlsen vs Gao">
      <label>PGN</label>
      <textarea id="pg" placeholder="[Event ...]&#10;1. e4 c5 ..."></textarea>
      <div class="row" style="margin-top:14px">
        <button class="primary" onclick="create()">Buat proyek</button>
        <span id="msg" class="err"></span>
      </div>
    </div>`;
}

async function create() {
  $("msg").textContent = "";
  try {
    const { id } = await api("api/projects", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_url: $("vp").value, name: $("nm").value, pgn_text: $("pg").value }),
    });
    await loadList(); open_(id);
  } catch (e) { $("msg").textContent = e.message; }
}

async function open_(id) {
  if (dirty && !confirm("Ada perubahan waktu yang belum disimpan. Tinggalkan?")) return;
  toggleDrawer(false);
  current = id; selected = null; dirty = false; picking = false; pick = null; pickAt = null; uploadFormKey = null; uploadDirty = false;
  segStart = null; clearInterval(rafId);
  clearInterval(spRafId); spWindowsKey = null; spLoopActive = false;
  spTime = null; spPlaying = false; spWindows = []; spFramePlies = null; spScrubbing = false;
  spTextKey = null; shortOptsFor = null; stepFor = null;
  clearInterval(timer); await refresh(); loadList();
  timer = setInterval(() => { if (state?.busy) refresh(); }, 1500);
}

async function refresh() {
  if (!current) return;
  state = await api(`api/projects/${current}`);
  draw();
}

let logOpen = false;

// ------------------------------------------------------------------ project steps
// A project is worked through in order: detect, lay out the long video, cut the
// short, pick the board look and render, then publish. Each step shows only its
// own controls; the nav stays free to jump around once a step's inputs exist.
const STEPS = [
  { n: 1, label: "Deteksi" },
  { n: 2, label: "Tata letak" },
  { n: 3, label: "Short" },
  { n: 4, label: "Tampilan & render" },
  { n: 5, label: "Terbitkan" },
];
const PICKING_FOR = { 2: "layout", 3: "short", 5: "thumb" };
let step = 1, stepFor = null;

function defaultStep(s) {
  if (!s.waypoints) return 1;
  const outs = s.outputs || [];
  if (!outs.includes("full-video.mp4") && !outs.includes("short.mp4")) return 2;
  return 5;
}
function stepReady(n, s) {
  if (n === 1) return true;
  if (n === 3 || n === 4) return !!s.waypoints;
  return !!s.width;
}
function stepDone(n, s) {
  const outs = s.outputs || [];
  return n === 1 ? !!s.waypoints
    : n === 2 ? !!(s.paste_rect || (s.logo_rects || []).length || (s.blur_rects || []).length
                   || s.brand_rect || s.name_rects?.white || s.name_rects?.black || s.source_zoom)
    : n === 3 ? !!s.has_short_layout
    : n === 4 ? outs.includes("full-video.mp4") || outs.includes("short.mp4")
    : !!s.has_thumbnail;
}

// Loads what a step's editor needs the first time it is shown, then redraws.
async function prepareStep(n) {
  if (n === 3 && !musicList.length) {
    try { musicList = (await api("api/sounds")).music; } catch (e) {}
  }
  if (n === 5) {
    await initThumb();
    if (!uploadTemplates) {
      try { uploadTemplates = (await api("api/upload-templates")).channels; } catch (e) {}
    }
  }
  if (n === 3 || n === 5) draw();
}

async function setStep(n) {
  if (!state || !stepReady(n, state)) return;
  if (step === 3 && n !== 3) leaveShort();
  step = n; pick = null;
  picking = PICKING_FOR[n] || false;
  draw();
  prepareStep(n);
  $("stepNav")?.scrollIntoView({ block: "nearest" });
}

function stepNav(s) {
  return `<nav id="stepNav" class="stepper" aria-label="Langkah proyek">${STEPS.map(({ n, label }) => {
    const done = stepDone(n, s), on = n === step;
    return `<button class="${on ? "on" : ""} ${done ? "done" : ""}" ${stepReady(n, s) ? "" : "disabled"}
        onclick="setStep(${n})" ${on ? 'aria-current="step"' : ""}>
      <span class="n">${done && !on ? "✓" : n}</span><span class="lbl">${label}</span></button>`;
  }).join("")}</nav>`;
}

function stepFoot(n) {
  const prev = STEPS[n - 2], next = STEPS[n];
  return `<div class="step-foot">
    ${prev ? `<button class="ghost" onclick="setStep(${prev.n})">← ${prev.label}</button>` : "<span></span>"}
    ${next ? `<button ${stepReady(next.n, state) ? "" : "disabled"} onclick="setStep(${next.n})">Lanjut: ${next.label} →</button>` : ""}
  </div>`;
}

function stepHead(title, text) {
  return `<div class="step-head"><h3>${title}</h3>${text ? `<p>${text}</p>` : ""}</div>`;
}

function stepBody(s) {
  const busy = s.busy, outputs = s.outputs || [];
  const done = (s.waypoints || []).filter((w) => w.timestamp !== null);
  const observed = done.filter((w) => w.observed).length;
  const hasBoard = outputs.includes("board.mp4");
  const cutDirty = shortOptsDirty(s);
  const fileLink = (f, quiet) => outputs.includes(f)
    ? `<a class="file${quiet ? " quiet" : ""}" href="api/projects/${current}/file/${f}" target="_blank">${f} ↗</a>` : "";
  if (step === 1) return `
    <div class="card">
      ${stepHead("Deteksi", "Aplikasi membaca papan digital di video dan mencocokkannya dengan PGN, jadi tiap langkah dapat waktunya sendiri.")}
      <div class="row">
        ${s.status === "failed" && !s.width ? `<button class="primary" ${busy ? "disabled" : ""}
                onclick="run('retry-download')">Coba unduh lagi</button>` : ""}
        <button ${busy || !s.width ? "disabled" : ""} onclick="run('detect')"
                ${!s.waypoints && s.width ? 'class="primary"' : ""}>
          ${s.waypoints ? "Deteksi ulang" : "Mulai deteksi"}</button>
        <span class="hint">${!s.width ? "Menunggu video selesai diunduh…"
          : s.waypoints ? `<span class="num">${done.length}/${s.plies_total}</span> ply berwaktu ·
            <span class="num">${observed}</span> terbaca langsung` : "Sekitar 1–3 menit."}</span>
      </div>
    </div>
    ${s.waypoints ? waypointsCard(s) : ""}
    ${stepFoot(1)}`;
  if (step === 2) return `${previewCard(s)}${stepFoot(2)}`;
  if (step === 3) return `
    <div class="card">
      ${stepHead("Short", "Berapa ply terakhir yang dipakai dan seberapa rapat potongannya, lalu atur posisi papan dan teks caption.")}
      <div class="row" style="margin-bottom:14px">
        <label class="field" for="shortPlies">ply
          <input id="shortPlies" type="number" min="1" value="${shortOpts.plies}"
                 title="Jumlah ply terakhir yang dipakai" oninput="setShortOpt('plies', this.value)"></label>
        <label class="field" for="shortPad">jeda
          <input id="shortPad" type="number" min="0.1" step="0.1" value="${shortOpts.pad}"
                 title="Detik disisakan sebelum & sesudah tiap ply -- makin kecil, makin pendek shortnya"
                 oninput="setShortOpt('pad', this.value)"></label>
        <label class="field" for="shortTail">ekor
          <input id="shortTail" type="number" min="0" step="0.5" value="${shortOpts.tail}"
                 title="Detik tambahan setelah ply terakhir -- posisi akhir ditahan selama ini"
                 oninput="setShortOpt('tail', this.value)"></label>
        <span id="shortEstimate" class="hint num"></span>
        <button id="shortSave" ${busy || !cutDirty ? "disabled" : ""}
                ${cutDirty ? 'class="primary"' : ""} onclick="saveShortOpts()"
                title="Simpan ply/jeda/ekor ke proyek ini">
          ${cutDirty ? "Simpan durasi" : "Tersimpan"}</button>
      </div>
      ${shortEditorCard(s)}
    </div>
    ${stepFoot(3)}`;
  if (step === 4) return `
    ${s.themes ? lookCard(s) : ""}
    <div class="card">
      ${stepHead("Render", "Pakai tampilan papan di atas. Video panjang dan short dirender terpisah — short memakai ulang board.mp4, jadi cepat.")}
      <div class="render-grid">
        <div class="render-item">
          <b>Video panjang</b>
          <div class="row">
            <button class="primary" ${busy || !s.waypoints ? "disabled" : ""} onclick="runRender()"
                    title="Render board.mp4 + full-video.mp4">Render video panjang</button>
          </div>
          <div class="row">${fileLink("full-video.mp4")}${fileLink("board.mp4", true)}</div>
        </div>
        <div class="render-item">
          <b>Short</b>
          <div class="row">
            <button class="primary" ${busy || !s.waypoints ? "disabled" : ""} onclick="runShort()"
                    title="${hasBoard ? "Pakai board.mp4 dari render sebelumnya"
                      : "board.mp4 dibuat dulu karena belum ada, jadi kali ini lebih lama"}">Render short</button>
            <span class="hint"><span class="num">${shortOpts.plies}</span> ply terakhir</span>
          </div>
          <div class="row">${fileLink("short.mp4")}</div>
        </div>
      </div>
    </div>
    ${stepFoot(4)}`;
  return `
    <div class="card">
      ${stepHead("Thumbnail", "")}
      ${pickerBody(s)}
    </div>
    ${uploadFiles(s).length && uploadTemplates ? uploadCard(s)
      : `<div class="card">${stepHead("Paket upload", uploadFiles(s).length ? "Memuat…" : "Render dulu video panjang atau short di langkah 4.")}</div>`}
    ${stepFoot(5)}`;
}
const STATUS_TEXT = { new: "baru", downloading: "mengunduh", ready: "siap", detecting: "mendeteksi",
  retiming: "menyesuaikan waktu", evaluating: "mengevaluasi", rendering: "merender",
  thumbnail: "membuat thumbnail", done: "selesai", failed: "gagal" };
function statusLabel(s) { return (STATUS_TEXT[s.status] || s.status) + (s.busy ? "…" : ""); }
function statusTone(s) {
  if (s.busy) return "run";
  return s.status === "failed" ? "bad" : s.status === "done" ? "ok" : "";
}

function toggleDrawer(force) {
  document.body.classList.toggle("drawer-open", force);
  $("drawerToggle").setAttribute("aria-expanded", document.body.classList.contains("drawer-open"));
}

function draw() {
  const s = state, busy = s.busy;
  const done = (s.waypoints || []).filter((w) => w.timestamp !== null);
  const observed = done.filter((w) => w.observed).length;
  const hasBoard = (s.outputs || []).includes("board.mp4");
  if (shortOptsFor !== current) {          // opening a project: start from what it stored
    shortOptsFor = current;
    shortOpts = { plies: s.short_plies ?? 20, pad: s.short_pad ?? 1, tail: s.short_tail ?? 0 };
    leadIn = s.lead_in ?? 0;
    outro = s.outro ?? 60;
    thumbAt = s.thumb_time ?? 0;
    thumbPrompt = s.thumb_prompt || ""; thumbPromptDirty = false;
  }
  if (stepFor !== current) { stepFor = current; step = defaultStep(s); prepareStep(step); }
  picking = PICKING_FOR[step] || false;
  const cutDirty = shortOptsDirty(s);
  const outputs = s.outputs || [];
  const fileLink = (f, quiet) => outputs.includes(f)
    ? `<a class="file${quiet ? " quiet" : ""}" href="api/projects/${current}/file/${f}" target="_blank">${f} ↗</a>` : "";
  const dl = s.download_progress;
  $("panel").innerHTML = `
    <div class="proj-head">
      <div style="min-width:0">
        <h2>${escape_(s.name)}</h2>
        <p class="meta">
          <span>${escape_(s.white)} — ${escape_(s.black)}</span>
          <span class="num">${s.plies_total} ply</span>
          ${s.duration ? `<span class="num">${fmtTime(s.duration)}</span>` : ""}
          <span class="pill ${statusTone(s)}">${statusLabel(s)}</span>
          ${s.waypoints ? `<span title="${observed} ply terbaca langsung dari papan overlay">
            <span class="num">${done.length}/${s.plies_total}</span> ply berwaktu</span>` : ""}
        </p>
      </div>
      <button class="danger" ${busy ? "disabled" : ""} title="Hapus proyek ini beserta videonya"
              onclick="deleteProject('${current}','${escape_(s.name).replace(/'/g, "\\'")}')">Hapus proyek</button>
    </div>
    ${s.error ? `<p class="notice">${escape_(s.error)}</p>` : ""}
    ${dl ? `<div style="margin:0 0 14px">
      <div class="progress"><div style="width:${dl.percent}%"></div></div>
      <p class="hint" style="margin:5px 0 0">Mengunduh video: <span class="num">${dl.percent}%</span>${
        dl.eta && dl.eta !== "Unknown" ? ` · sisa <span class="num">${dl.eta}</span>` : ""}</p></div>` : ""}

    ${stepNav(s)}
    ${stepBody(s)}
    ${s.log ? `<details class="log" ${logOpen || busy || s.status === "failed" ? "open" : ""}
         ontoggle="logOpen = this.open"><summary>Log</summary>
       <pre id="log">${escape_(s.log)}</pre></details>` : ""}`;
  if (s.waypoints) updateShortEstimate();
  if (picking === "short") { wireShortPicker(); wireShortPreview(); }
  else if (picking) {
    wirePicker();
    if (picking === "thumb") { wireThumbPicker(); refreshThumbPromptButton(); }
  }
  const log = $("log"); if (log) log.scrollTop = log.scrollHeight;
  if (segStart !== null && s.waypoints) showSegment(segStart);
}

// core/classify.py's grades. "excellent" and "good" get no symbol on purpose --
// between them they cover most of a strong game, and a chip on nearly every row
// would bury the handful that matter.
const GRADES = { brilliant: "!!", great: "!", best: "★",
                 inaccuracy: "?!", mistake: "?", blunder: "??" };

function gradeChip(w) {
  if (!GRADES[w.label]) return "";
  const loss = w.loss === null || w.loss === undefined ? "" : ` · -${w.loss}% peluang menang`;
  return ` <span class="grade grade-${w.label}" title="${w.label}${loss}">${GRADES[w.label]}</span>`;
}

function gradeCounts(counts) {
  const parts = Object.keys(GRADES).filter((name) => counts[name]).map((name) =>
    `<span class="grade grade-${name}" title="${name}">${GRADES[name]} ${counts[name]}</span>`);
  return parts.length ? parts.join(" ") : `<span class="hint">tidak ada</span>`;
}

function waypointsCard(s) {
  const rows = s.waypoints.map((w) => {
    const tag = w.edited ? `<span class="tag edited">manual</span>`
      : w.source === "physical" ? `<span class="tag ok">papan ${w.shift >= 0 ? "+" : ""}${w.shift}s</span>`
      : w.observed ? `<span class="tag ok">overlay</span>`
      : `<span class="tag guess">tebakan</span>`;
    const flag = w.needs_review ? ` <span class="tag guess">cek</span>` : "";
    const move = `${w.move_number}${w.side === "white" ? "." : "..."} ${escape_(w.san)}`;
    return `<tr class="ply ${selected === w.ply ? "on" : ""}" onclick="showReview(${w.ply})">
      <td style="color:var(--muted)">${w.ply}</td><td>${move}${gradeChip(w)}</td>
      <td>${fmt(w.timestamp)}</td><td>${tag}${flag}</td></tr>`;
  }).join("");
  return `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:9px">
        <b style="font-size:13px">Timeline</b>
        <button ${dirty ? "" : "disabled"} onclick="save()">Simpan perubahan</button>
      </div>
      <div class="split">
        <div class="scroll"><table>
          <thead><tr><th>#</th><th>langkah</th><th>waktu</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div id="review"><p class="hint">Klik satu langkah untuk memutar rentang
          ${segLen} detik di sekitarnya.</p></div>
      </div>
    </div>`;
}

        </div>
        <div class="row" style="gap:8px;margin-top:5px">

        </div>` : ""}

async function setLook(field, value) {
  await api(`api/projects/${current}/look`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [field]: value }),
  });
  lookStamp = Date.now();

async function startEvaluate() {
  try {
    const result = await api(`api/projects/${current}/evaluate`, { method: "POST" });
    lookStamp = Date.now();
    if (result.source === "engine") { pollBusy(); return; }
    refresh();
  } catch (e) { alert(e.message); }
}

let previewTab = "paste";      // a LAYERS key, "board", "thumb" or "short"

function togglePreview() { if (picking) closePreview(); else setPreviewTab(previewTab); }
function closePreview() { leaveShort(); picking = false; pick = null; draw(); }
// kept for the handful of callers that open a specific tab
function setLayer(name) { setPreviewTab(name); }
function toggleShort() { if (picking === "short") closePreview(); else setPreviewTab("short"); }
function toggleThumb() { if (picking === "thumb") closePreview(); else setPreviewTab("thumb"); }

function leaveShort() {
  if (picking !== "short") return;
  clearInterval(spRafId);
  spLoopActive = false; spPlaying = false; spTime = null; spWindowsKey = null;
  spWindows = []; spFramePlies = null; spScrubbing = false; spTextKey = null;
  if (spAudioEl) spAudioEl.pause();
}

async function setPreviewTab(tab) {
  if (tab !== "short") leaveShort();
  if (tab === "short" && !musicList.length) {
    try { musicList = (await api("api/sounds")).music; } catch (e) {}
  }
  if (tab === "thumb" && picking !== "thumb") await initThumb();
  if (LAYERS[tab]) layer = tab;
  picking = tab === "board" || tab === "thumb" || tab === "short" ? tab : "layout";
  previewTab = tab; pick = null;
  draw();
}
function setShortLayer(name) { shortLayer = name; pick = null; draw(); }
function fmtTime(t) {
  if (t === null || t === undefined) return "—";
  const total = Math.max(0, Math.round(t));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
}

function parseTime(raw) {
  const parts = String(raw).trim().split(":").map(Number);
  if (!parts.length || parts.some(Number.isNaN)) return null;
  return parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0];
}

// Frame scrubber shared by the layout picker and the thumbnail frame picker. The
// still JPEG from /frame stays the thing boxes are drawn against (it is what the
// backend crops from); the source <video> is laid over it only while playing or
// dragging the slider, so the whole broadcast can be skimmed without one ffmpeg
// call per step. When playback stops the exact still for that second is fetched and
// the video steps aside once it has loaded.
//
// `crop` mirrors core/render.zoom_crop_rect so the video shows the same zoomed
// window as a `zoomed=1` frame.
function zoomCrop(s) {
  const zoom = s.source_zoom;
  if (!zoom || (zoom.percent || 100) <= 100 || !s.width || !s.height) return null;
  const factor = zoom.percent / 100;
  const w = Math.round(s.width / factor), h = Math.round(s.height / factor);
  const cx = (zoom.x ?? 0.5) * s.width, cy = (zoom.y ?? 0.5) * s.height;
  return { w, h, W: s.width, H: s.height,
           x: Math.round(Math.min(Math.max(cx - w / 2, 0), s.width - w)),
           y: Math.round(Math.min(Math.max(cy - h / 2, 0), s.height - h)) };
}
// The stretch of broadcast the long video will actually contain: from `leadIn`
// seconds before the first move to `outro` seconds after the last one -- the same
// arithmetic start_render does. Uses the SAVED values: the preview re-fits when
// "Simpan" is pressed, not on every keystroke. null before detection (no timestamps).
function outputWindow(s) {
  const times = (s.waypoints || []).map((w) => w.timestamp).filter((t) => t !== null && t !== undefined);
  if (!times.length) return null;
  const first = times[0], last = times[times.length - 1];
  const lo = Math.max(0, first - (s.lead_in ?? 0));
  const hi = Math.min(s.duration || Infinity, Math.max(lo + 1, last + (s.outro ?? 60)));
  return { first, last, lo, hi };
}

// Under the layout preview: where this second lands in the finished video, and the
// number to type into "mulai −" / "selesai +" to make the video start or stop here.
let pickInfoHtml = "";
function renderPickInfo(t) {
  const host = $("pickInfo");
  if (!host || picking === "thumb") return;
  const w = outputWindow(state);
  let html = "";
  if (w) {
    const pos = Math.max(0, t - w.lo), total = w.hi - w.lo;
    const stop = Math.round(t - w.last), start = Math.round(w.first - t);
    html = `Di video jadi: <b>${fmtTime(pos)}</b> / ${fmtTime(total)} · sisa ${fmtTime(total - pos)}
      <div class="row" style="margin-top:5px;gap:6px">
      ${stop >= 0
        ? `<span>Stop di sini → isi <b>selesai + ${stop}</b></span>
           <button onclick="useWindowValue('outro', ${stop})" style="padding:3px 10px;font-size:12px">Pakai</button>`
        : `<span>Belum bisa stop di sini: langkah terakhir di ${fmtTime(w.last)}</span>`}
      ${start >= 0
        ? `<span style="margin-left:8px">Mulai di sini → isi <b>mulai − ${start}</b></span>
           <button onclick="useWindowValue('lead', ${start})" style="padding:3px 10px;font-size:12px">Pakai</button>`
        : ""}
      </div>`;
  }
  if (html !== pickInfoHtml) { host.innerHTML = html; pickInfoHtml = html; }
}

async function useWindowValue(kind, value) {
  if (kind === "outro") outro = value; else leadIn = value;
  try {
    await post(kind === "outro" ? "outro" : "lead-in", { seconds: value });
    await refresh();
  } catch (e) { alert(e.message); }
}

function scrubVideo(id, at, crop) {
  const place = crop
    ? `left:${-crop.x / crop.w * 100}%;top:${-crop.y / crop.h * 100}%;
       width:${crop.W / crop.w * 100}%;height:${crop.H / crop.h * 100}%`
    : "left:0;top:0;width:100%;height:100%";
  return `<div id="${id}Cover" style="position:absolute;inset:0;overflow:hidden;display:none;
       pointer-events:none;border-radius:7px;background:#000">
    <video id="${id}Video" muted playsinline preload="none"
           data-src="api/projects/${current}/${state.preview_video ? "preview-video" : "video"}"
           style="position:absolute;${place};max-width:none"></video></div>`;
}
function scrubControls(id, at, duration, extra = "", min = 0) {
  return `<div class="row scrub-row" style="margin-top:8px">
    <button id="${id}Play" title="Putar / jeda" style="min-width:44px">▶</button>
    <input id="${id}Range" type="range" min="${min}" max="${duration}" step="0.1" value="${at}"
           style="flex:1;min-width:140px;padding:0">
    <input id="${id}Time" type="text" value="${fmtTime(at)}" placeholder="mm:ss"
           style="width:66px" title="Ketik detik siaran atau mm:ss lalu Enter">
    <span id="${id}Total" class="hint">/ ${fmtTime(duration)}</span>
    ${extra}
  </div>
  ${id === "pick" && picking !== "thumb" ? windowInputs() : ""}
  <div id="${id}Info" class="hint scrub-info" style="margin-top:6px"></div>`;
}
function wireScrubber(id, img, { frameSrc, onTime, onLabel }) {
  const video = $(`${id}Video`), cover = $(`${id}Cover`), range = $(`${id}Range`),
        box = $(`${id}Time`), play = $(`${id}Play`);
  if (!video || !img) return;
  let active = false;            // true while playing or dragging: the video is on top
  // Nothing is fetched until the first drag or play. Every redraw (tab switch, box
  // saved) builds a fresh <video>, and a desktop browser used to pull ~2 MB of the
  // source for each one straight away; phones don't preload, which is why the same
  // page felt lighter there. `data-src` is the 540p keyframe-every-second copy once
  // the server has made it (preview_video), the source file until then.
  const seekTo = (t) => {
    if (!video.getAttribute("src")) {
      video.preload = "auto";           // with "none", setting src alone loads nothing
      video.src = video.dataset.src;
      video.addEventListener("loadedmetadata", () => { video.currentTime = +range.value; }, { once: true });
      video.load();
      return;
    }
    video.currentTime = t;
  };
  const label = (t) => {
    range.value = t;
    if (document.activeElement !== box) box.value = fmtTime(t);
    if (onLabel) onLabel(t);
  };
  const seek = (t) => { active = true; seekTo(t); label(t); onTime(t); };
  const settle = (t) => {
    t = Math.round(t * 10) / 10;
    active = false;
    label(t); onTime(t);
    const src = frameSrc(t);
    if (img.getAttribute("src") === src) { cover.style.display = "none"; return; }
    img.setAttribute("src", src);
  };
  img.addEventListener("load", () => { if (!active) cover.style.display = "none"; });
  video.addEventListener("seeked", () => { if (active) cover.style.display = "block"; });
  video.addEventListener("playing", () => { cover.style.display = "block"; });
  video.addEventListener("timeupdate", () => {
    if (!video.paused) { label(video.currentTime); onTime(Math.round(video.currentTime * 10) / 10); }
  });
  video.addEventListener("pause", () => { play.textContent = "▶"; settle(video.currentTime); });
  play.onclick = () => {
    if (!video.paused) { video.pause(); return; }
    active = true;
    const t = +range.value;
    if (!video.getAttribute("src")) seekTo(t);
    else if (Math.abs(video.currentTime - t) > 0.3) video.currentTime = t;
    play.textContent = "❚❚";
    video.play().catch((e) => { play.textContent = "▶"; active = false; alert(e.message); });
  };
  range.oninput = () => seek(+range.value);
  range.onchange = () => { if (video.paused) settle(+range.value); };
  box.onchange = () => {
    const t = parseTime(box.value);
    if (t === null) return;
    const clamped = Math.min(Math.max(t, +range.min || 0), +range.max || t);
    if (!video.paused) video.pause();
    if (video.getAttribute("src")) video.currentTime = clamped;
    settle(clamped);
  };
}

// The one preview everything is set on: a broadcast frame + scrubber shared by the
// long-video layers, the physical-board corners and the thumbnail's source frame.
// The time is shared too (pickAt), so switching tabs keeps you on the same moment.
// The short is the exception -- its 9:16 canvas is a different picture -- so its
// tab swaps in its own editor inside the same card.
function pickerBody(s) {
  const isLayout = picking === "layout", isThumb = picking === "thumb";
  const isZoom = isLayout && layer === "zoom";
  const duration = s.duration || 60;
  const win = isThumb ? null : outputWindow(s);
  const lo = win ? win.lo : 0, hi = win ? win.hi : duration;
  const fallback = isThumb && s.thumb_time != null ? s.thumb_time : Math.round(lo + (hi - lo) * 0.55);
  const at = Math.min(Math.max(pickAt ?? fallback, lo), hi);
  const spec = LAYERS[layer];
  const count = isLayout && !spec.special ? spec.get(s).length : 0;
  const fixedSize = isLayout && spec.pairSize && !count ? spec.pairSize(s) : null;
  const hint = isThumb
    ? "<b>1. Pilih frame.</b> Geser ke momen yang ekspresinya paling kuat, lalu \"Pakai frame ini\" — itu yang dikirim ke AI. Frame thumbnail diambil dari siaran utuh (tanpa zoom)."
    : isLayout ? spec.hint
    : "Klik 4 sudut papan kayu searah jarum jam: kiri-atas, kanan-atas, kanan-bawah, kiri-bawah. Setelah 4 titik, tarik titiknya biar pas mengikuti sudut miring kamera. Jangan ikutkan pemain, jam, atau papan digital.";
  return `
    <p class="hint" style="margin:0 0 9px">${hint}
      ${fixedSize ? ` Ukuran kotak (${fixedSize[0]}×${fixedSize[1]} px) mengikuti kotak nama satunya —
      klik lalu geser untuk menempatkan, tidak perlu digambar ulang.` : ""}
      ${isLayout && !isZoom && s.source_zoom ? ` Pratinjau di bawah sudah mengikuti zoom
      ${s.source_zoom.percent}% yang diatur di tab Zoom — kotak yang kamu buat di sini otomatis
      dalam skala yang sama.` : ""}
</p>
    ${isZoom ? `<div class="row" style="margin-bottom:9px;align-items:center">
      <span class="hint">Persen zoom:</span>
      <input id="zoompercent" type="number" min="100" max="500" step="5"
             value="${s.source_zoom?.percent || 100}" onchange="setZoomPercent(this.value)"
             style="width:70px;font-size:12px;padding:3px 6px">%
      <span class="hint">(100% = tanpa zoom)</span>
    </div>` : ""}
    ${!isThumb ? `<p class="hint touch-only" style="margin:0 0 6px">Sentuh gambar dan tahan sebentar sampai bergetar, lalu geser jari untuk menggambar/memindah kotak. Ketuk biasa = klik.</p>` : ""}
    <div id="pickwrap" class="pickarea" style="position:relative;display:inline-block;
         cursor:${isThumb ? "default" : isZoom ? "move" : "crosshair"};user-select:none;-webkit-user-drag:none">
      <img id="pickimg" draggable="false" style="display:block;border-radius:7px;max-width:100%"
           src="${pickFrameSrc(at)}">
      ${scrubVideo("pick", at, isLayout && !isZoom ? zoomCrop(s) : null)}
      <div id="pickghosts"></div>
      <div id="pickexisting"></div>
      ${isZoom ? `<div id="zoombox" style="position:absolute;border:2px solid ${spec.colour};
           background:${spec.colour}26;pointer-events:none;cursor:move"></div>` : ""}
      ${isLayout && !isZoom ? `<div id="pickbox" style="position:absolute;border:2px solid ${spec.colour};
           background:${spec.colour}2e;display:none;pointer-events:none"></div>` : ""}
      ${picking === "board" ? `
      <svg id="pickpoly" style="position:absolute;left:0;top:0;pointer-events:none" width="100%" height="100%">
        <polygon id="pickpolygon" points="" fill="rgba(123,178,106,.18)" stroke="var(--accent)" stroke-width="2"></polygon>
      </svg>
      <div id="pickhandles"></div>` : ""}
    </div>
    ${scrubControls("pick", at, hi, isThumb
      ? `<button class="primary" onclick="useThumbFrame()">Pakai frame ini</button>` : "", lo)}
    <div class="row" style="margin-top:10px">
      ${isThumb
        ? `<span class="hint">${s.has_thumb_source ? `Frame tersimpan di ${fmtTime(s.thumb_time)}.` : "Belum ada frame tersimpan."}</span>
           ${s.has_thumb_source ? `<button onclick="pickAt=${s.thumb_time};draw()" style="padding:3px 10px;font-size:12px">Lompat ke sana</button>` : ""}`
        : isZoom
        ? `${s.source_zoom ? `<button onclick="resetZoom()">Hapus zoom</button>` : ""}`
        : isLayout
        ? `<button class="primary" id="pickok" disabled onclick="addRect()">
             ${spec.multi ? "Tambah kotak" : "Simpan kotak"}</button>
           ${count ? `<button onclick="clearLayer()">Hapus kotak ${spec.label.toLowerCase()}</button>` : ""}`
        : `<button class="primary" id="quadok" disabled onclick="saveQuad()">Simpan area</button>
           <button onclick="resetQuad()">Ulang dari awal</button>
           <button onclick="clearQuad()">Hapus area</button>`}
      <span id="pickmsg" class="hint">${isZoom ? "Klik lalu geser kotaknya untuk memindah arena." : ""}</span>
    </div>
    ${isLayout && layer === "brand" ? brandUpload(s) : ""}
    ${isThumb ? thumbSteps(s) : ""}`;
}

// Tabs of the single preview card. Long-video layers first (they share one frame),
// then the physical board, the thumbnail and the short.
function previewTabs(s) {
  const layers = Object.entries(LAYERS).map(([name, l]) => `<button onclick="setPreviewTab('${name}')"
      style="padding:4px 10px;font-size:12px;${layer === name ? `border-color:${l.colour};color:${l.colour}` : ""}">${
      l.label}${l.special ? (s.source_zoom ? ` (${s.source_zoom.percent}%)` : "")
                : (l.get(s).length ? ` (${l.get(s).length})` : "")}</button>`).join("");
  return `<div class="row" style="margin-bottom:10px;gap:6px">${layers}</div>`;
}

function previewCard(s) {
  return `<div class="card">
    ${stepHead("Tata letak video panjang", "Atur apa yang tampil di video hasil. Kotak garis putus-putus = pengaturan tab lain.")}
    ${previewTabs(s)}
    ${pickerBody(s)}
  </div>`;
}

// Every other tab's boxes, dashed and inert, so one frame shows the whole setup.
// Layer rects live in the zoomed frame's pixels (scaled to the source size); the
// zoom, board and thumbnail tabs show the untouched frame, so there they are mapped
// back through the zoom crop. The physical-board quad is the other way round.
function drawGhosts() {
  const img = $("pickimg"), host = $("pickghosts");
  if (!img || !host || !state.width) return;
  if (picking === "thumb") { host.innerHTML = ""; return; }   // the thumbnail is its own picture
  const scale = img.clientWidth / state.width;
  const zoomedFrame = picking === "layout" && layer !== "zoom";
  const crop = zoomCrop(state);
  const fromZoomed = (r) => !crop || zoomedFrame ? r
    : [crop.x + r[0] * crop.w / crop.W, crop.y + r[1] * crop.h / crop.H, r[2] * crop.w / crop.W, r[3] * crop.h / crop.H];
  const fromSource = ([x, y]) => !crop || !zoomedFrame ? [x, y]
    : [(x - crop.x) * crop.W / crop.w, (y - crop.y) * crop.H / crop.h];
  let html = "";
  Object.entries(LAYERS).forEach(([name, l]) => {
    if (l.special || (picking === "layout" && name === layer)) return;
    l.get(state).forEach((rect) => {
      const [x, y, w, h] = fromZoomed(rect).map((v) => v * scale);
      html += `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;
        border:1px dashed ${l.colour};pointer-events:none;opacity:.8">
        <span style="position:absolute;left:0;top:0;font-size:9px;line-height:1;padding:1px 3px;
          background:#000a;color:${l.colour};white-space:nowrap">${l.label}</span></div>`;
    });
  });
  host.innerHTML = html;
}

function brandUpload(s) {
  return `<div class="row" style="margin-top:12px;align-items:center">
    <input type="file" id="brandfile" accept="image/png,image/jpeg,image/webp"
           onchange="uploadBrand()" style="font-size:12px">
    ${s.brand_file ? `<img src="api/projects/${current}/file/${s.brand_file}?_=${lookStamp}"
        style="height:34px;border-radius:4px;background:#0003;padding:3px">
      <button onclick="removeBrand()">Hapus logo</button>`
      : `<span class="hint">belum ada logo diunggah</span>`}
  </div>`;
}

async function uploadBrand() {
  const input = $("brandfile");
  if (!input.files?.length) return;
  const body = new FormData();
  body.append("file", input.files[0]);
  try {
    const response = await fetch(`api/projects/${current}/brand`, { method: "POST", body });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
    lookStamp = Date.now();
    refresh();
  } catch (e) { alert(e.message); }
}

async function removeBrand() {
  await api(`api/projects/${current}/brand`, { method: "DELETE" });
  refresh();
}
